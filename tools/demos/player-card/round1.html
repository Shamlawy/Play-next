<title>Player type card demos</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Poppins:wght@500;600;700;800&family=Cinzel:wght@600;700&display=swap">
<style>
/* Round 1: the player type card as a tarot card (the owner's reference: thin frame, numeral in a diamond, art in tilted diamonds, a name plate, ornate corners).
   Layout and style only, our colours, nothing moves. A = one arcana card, B = sun-and-ring card, C = a spread (the traits are cards too), D = diamond art + your deck. */
:root { color-scheme: dark; --bg:#000; --pan:#0a0e1b; --volt:#4DA3FF; --vrgb:77,163,255; --ice:#EAF2FF; --mute:#7C92C4; --line:rgba(234,242,255,.14); --font:"Poppins",system-ui,sans-serif; --serif:"Cinzel",Georgia,serif; }
* { box-sizing: border-box; }
html { background:#000; }
body { margin:0; padding:14px 16px 40px; color:var(--ice); font:500 14px/1.4 var(--font); background:radial-gradient(120% 50% at 50% -10%, rgba(var(--vrgb),.13), transparent 60%), #000; }
.sw { display:flex; gap:8px; justify-content:center; margin:6px 0 14px; }
.sw button { font:700 13px var(--font); color:var(--mute); background:var(--pan); border:1px solid var(--line); border-radius:999px; padding:9px 16px; }
.sw button[aria-pressed=true] { background:var(--volt); color:#06101f; border-color:var(--volt); }
.cap { text-align:center; color:var(--mute); font-size:12.5px; margin:0 auto 12px; max-width:340px; }
.hero { max-width:560px; margin:0 auto; border-radius:26px; padding:20px 12px 20px; text-align:center; background:linear-gradient(180deg,#0d1226,#070a15); border:1px solid var(--line); overflow:hidden; }
.kick { font:600 12.5px var(--font); letter-spacing:.14em; color:var(--volt); margin:14px 0 2px; }
.hero h2 { margin:0; font:800 34px/1.05 var(--font); letter-spacing:-.025em; }
.line { color:#cfd9f5; font-size:15px; margin:10px 10px 0; }
.traits { display:flex; gap:8px; justify-content:center; margin-top:14px; flex-wrap:wrap; }
.traits span { padding:6px 11px; border-radius:999px; font:600 12px var(--font); background:rgba(255,255,255,.07); border:1px solid rgba(255,255,255,.1); white-space:nowrap; }
svg.ic { fill:currentColor; }
/* the tarot card */
.tc { position:relative; flex:none; width:min(62vw,250px); aspect-ratio:5/7; border-radius:14px; background:linear-gradient(180deg,#10162b,#080b17); box-shadow:0 22px 44px -20px #000; color:var(--volt); }
.tc::before { content:""; position:absolute; inset:7px; border:1px solid rgba(var(--vrgb),.7); }          /* the thin outer frame */
.tc::after { content:""; position:absolute; inset:12px; border:1px solid rgba(234,242,255,.14); }       /* a second hairline inside it */
.num { position:absolute; z-index:3; top:-1px; left:50%; width:30px; height:30px; transform:translateX(-50%) rotate(45deg); background:#080b17; border:1px solid var(--volt); border-radius:3px; }
.num b { position:absolute; inset:0; transform:rotate(-45deg); display:grid; place-items:center; font:700 11px var(--serif); color:var(--ice); }
.plate { position:absolute; z-index:3; left:50%; bottom:15px; transform:translateX(-50%); min-width:62%; padding:5px 12px; text-align:center; background:#080b17; border:1px solid var(--volt); font:700 12.5px var(--serif); color:var(--ice); white-space:nowrap; }
.dm { position:absolute; left:50%; top:46%; aspect-ratio:1; transform:translate(-50%,-50%) rotate(45deg); }
.art { position:absolute; left:50%; top:46%; transform:translate(-50%,-50%); display:grid; place-items:center; }
.art svg { width:100%; height:100%; }
.cn { position:absolute; width:26px; height:26px; color:#c7a85a; z-index:2; }
.cn.tl { top:3px; left:3px; } .cn.tr { top:3px; right:3px; transform:scaleX(-1); } .cn.bl { bottom:3px; left:3px; transform:scaleY(-1); } .cn.br { bottom:3px; right:3px; transform:scale(-1); }
/* A */
.A .dm.d1 { width:74%; background:linear-gradient(135deg,rgba(var(--vrgb),.34),rgba(var(--vrgb),.04)); }
.A .dm.d2 { width:58%; border:1px solid rgba(var(--vrgb),.8); }
.A .art { width:58%; aspect-ratio:1; }
/* B */
.B .ring { position:absolute; left:50%; top:46%; width:72%; aspect-ratio:1; transform:translate(-50%,-50%); border-radius:50%; border:1.5px solid var(--volt); background:radial-gradient(circle,rgba(var(--vrgb),.3),transparent 70%); }
.B .ring.r2 { width:84%; border:1px dashed rgba(var(--vrgb),.6); background:none; }
.B .art { width:46%; aspect-ratio:1; }
.B .st { position:absolute; width:5px; height:5px; background:var(--ice); transform:rotate(45deg); opacity:.8; }
.B .rule { position:absolute; bottom:20px; width:14%; height:1px; background:var(--volt); } .B .rule.l { left:6%; } .B .rule.r { right:6%; }
/* spread (C) */
.fan { display:flex; justify-content:center; align-items:center; gap:0; margin:6px -6px 0; }
.fan .tc.side { width:min(34vw,140px); opacity:.9; } .fan .tc.side:first-child { margin-right:-14px; transform:translateY(14px) rotate(-6deg); } .fan .tc.side:last-child { margin-left:-14px; transform:translateY(14px) rotate(6deg); }
.fan .tc.main { z-index:2; width:min(52vw,220px); }
.side .num { width:22px; height:22px; } .side .num b { font-size:8.5px; } .side .plate { font-size:9px; padding:3px 6px; bottom:11px; min-width:70%; }
.side .art { width:50%; aspect-ratio:1; } .side .dm { width:62%; border:1px solid rgba(var(--vrgb),.6); } .side .cn { width:16px; height:16px; }
.C .main .art { width:56%; aspect-ratio:1; } .C .main .dm { width:70%; background:linear-gradient(135deg,rgba(var(--vrgb),.3),rgba(var(--vrgb),.03)); border:1px solid rgba(var(--vrgb),.8); }
/* D */
.D .dm.d1 { width:86%; background:linear-gradient(160deg,rgba(var(--vrgb),.55),rgba(var(--vrgb),.05) 70%); }
.D .dm.d2 { width:62%; border:1px solid var(--ice); opacity:.55; transform:translate(-50%,-50%) rotate(45deg) translate(7px,-7px); }
.D .art { width:60%; aspect-ratio:1; color:#fff; }
.deck { display:grid; grid-template-columns:repeat(5,1fr); gap:8px; margin:18px 4px 0; }
.mini { position:relative; aspect-ratio:5/7; border-radius:7px; background:#0b1022; border:1px solid rgba(var(--vrgb),.6); display:grid; place-items:center; color:var(--volt); }
.mini svg { width:56%; height:56%; } .mini i { position:absolute; top:3px; left:0; right:0; text-align:center; font:700 7px var(--serif); font-style:normal; color:var(--ice); }
.mini.lock { border-color:rgba(234,242,255,.12); color:#4a5a86; opacity:.7; }
.dcap { margin:12px 0 0; color:var(--mute); font-size:12.5px; }
</style>
<div class="sw" id="sw"></div>
<p class="cap" id="cap"></p>
<section class="hero" id="hero"></section>
<script>
const P = {
  skeptic: "<g opacity='.35'><circle cx='10.2' cy='10.2' r='7.6'/></g><path fill-rule='evenodd' d='M10.2 4.4a5.8 5.8 0 1 0 0 11.6 5.8 5.8 0 0 0 0-11.6zm0 2.2a3.6 3.6 0 1 1 0 7.2 3.6 3.6 0 0 1 0-7.2z'/><rect x='16' y='14.4' width='3.2' height='8' rx='1.6' transform='rotate(-45 17.6 18.4)'/>",
  oracle: "<g opacity='.35'><circle cx='12' cy='10.5' r='8.5'/></g><path d='M5.2 19.6h13.6l1.4 2.2H3.8z'/><path d='M7.8 9.4A4.4 4.4 0 0 1 11.6 5.6c.6-.1.9.7.3.9A3.5 3.5 0 0 0 9.5 9.8c-.1.7-1.6.7-1.7-.4z'/>",
  heart: "<g opacity='.35'><path d='M12 21.6C4.8 15.9 2.2 12.3 2.2 8.8A5.2 5.2 0 0 1 12 6.4a5.2 5.2 0 0 1 9.8 2.4c0 3.5-2.6 7.1-9.8 12.8z'/></g><path d='M12 17.6C8.2 14.4 6.6 12.4 6.6 10.2a2.8 2.8 0 0 1 5.4-1 2.8 2.8 0 0 1 5.4 1c0 2.2-1.6 4.2-5.4 7.4z'/>",
  compass: "<g opacity='.35'><circle cx='12' cy='12' r='10.2'/></g><path d='M17 7 13.8 13.8 7 17l3.2-6.8z'/>",
  devotee: "<g opacity='.35'><path d='M12 1.8 22.2 12 12 22.2 1.8 12z'/></g><path d='M12 6.6 17.4 12 12 17.4 6.6 12z'/>",
  optimist: "<g opacity='.35'><path d='M5.5 16.5a6.5 6.5 0 0 1 13 0z'/></g><rect x='2.5' y='18' width='19' height='2.2' rx='1.1'/><rect x='11' y='2.6' width='2' height='3.6' rx='1'/><rect x='3.5' y='6.8' width='2' height='3.6' rx='1' transform='rotate(-45 4.5 8.6)'/><rect x='18.5' y='6.8' width='2' height='3.6' rx='1' transform='rotate(45 19.5 8.6)'/>",
  critic: "<g opacity='.35'><path d='M12 2.2 20.4 5.4v6.2c0 5.2-3.5 8.8-8.4 10.4-4.9-1.6-8.4-5.2-8.4-10.4V5.4z'/></g><path d='M10.9 6.6h2.2v5.2h3.1V14h-3.1v3.4h-2.2V14H7.8v-2.2h3.1z'/>",
  books: "<g opacity='.35'><rect x='2.8' y='4' width='4.8' height='16' rx='1.3'/></g><rect x='9' y='2.8' width='4.8' height='17.2' rx='1.3'/><rect x='15.2' y='5.4' width='4.8' height='14.6' rx='1.3' transform='rotate(-10 17.6 12.7)'/><rect x='2.2' y='20.8' width='19.6' height='1.6' rx='.8'/>",
  finish: "<g opacity='.35'><path d='M6.4 3.6h13.2l-3.2 4.6 3.2 4.6H6.4z'/></g><rect x='4' y='2.4' width='2.4' height='19.2' rx='1.2'/>",
  duel: "<g opacity='.35'><circle cx='12' cy='12' r='10.4'/></g><rect x='10.9' y='3.6' width='2.2' height='16.8' rx='1.1' transform='rotate(45 12 12)'/><rect x='10.9' y='3.6' width='2.2' height='16.8' rx='1.1' transform='rotate(-45 12 12)'/>",
};
const ic = k => `<svg class="ic" viewBox="0 0 24 24" aria-hidden="true">${P[k]}</svg>`;
const CORN = `<svg class="cn __" viewBox="0 0 26 26" fill="currentColor"><path d="M2 2h12v1.4H3.4V14H2z"/><path d="M6 6h6v1.2H7.2V12H6z" opacity=".7"/><circle cx="3" cy="3" r="2"/></svg>`;
const corners = () => ["tl","tr","bl","br"].map(c => CORN.replace("__", c)).join("");
const NUM = ["0","I","II","III","IV","V","VI","VII","VIII","IX","X"];
const TYPES = [["oracle","Oracle"],["optimist","Optimist"],["skeptic","Skeptic"],["devotee","Devotee"],["critic","Tough critic"],["heart","Big heart"],["books","Collector"],["finish","Finisher"],["compass","Explorer"],["duel","Duelist"]];
const numOf = k => NUM[TYPES.findIndex(t => t[0] === k) + 1];
const nameOf = k => TYPES.find(t => t[0] === k)[1];
const card = (k, kind, cls = "") => {
  const base = `<div class="tc ${cls}"><span class="num"><b>${numOf(k)}</b></span>${corners()}`;
  const plate = `<span class="plate">${nameOf(k)}</span>`;
  if (kind === "A") return `${base}<i class="dm d1"></i><i class="dm d2"></i><span class="art">${ic(k)}</span>${plate}</div>`;
  if (kind === "B") return `${base}<i class="ring r2"></i><i class="ring"></i><i class="st" style="left:20%;top:22%"></i><i class="st" style="right:18%;top:30%"></i><i class="st" style="left:16%;top:64%"></i><i class="st" style="right:22%;top:70%"></i><span class="art">${ic(k)}</span><i class="rule l"></i><i class="rule r"></i>${plate}</div>`;
  if (kind === "C") return `${base}<i class="dm"></i><span class="art">${ic(k)}</span>${plate}</div>`;
  return `${base}<i class="dm d1"></i><i class="dm d2"></i><span class="art">${ic(k)}</span>${plate}</div>`;
};
const V = {
  A: { cap: "A · Arcana: one big tarot card. Numeral in a diamond, two tilted diamonds behind a huge emblem, a name plate, gold corners.",
    body: () => `<div class="A" style="display:flex;justify-content:center">${card("skeptic", "A")}</div>` },
  B: { cap: "B · Sun and ring: the Sun / Moon cards. The emblem sits in a ring with a dashed outer ring and little stars; the plate has lines either side.",
    body: () => `<div class="B" style="display:flex;justify-content:center">${card("skeptic", "B")}</div>` },
  C: { cap: "C · The spread: your type in the middle, your traits are cards too (replaces the two plain card backs).",
    body: () => `<div class="C fan">${card("heart", "C", "side")}${card("skeptic", "C", "main")}${card("compass", "C", "side")}</div>` },
  D: { cap: "D · Diamond + your deck: art drawn in a big tilted diamond that breaks the frame, and under it every type as a small card. The ones you haven't earned are dim.",
    body: () => `<div class="D" style="display:flex;justify-content:center">${card("skeptic", "D")}</div>
      <div class="deck">${TYPES.map(([k]) => { const own = ["skeptic","heart","compass"].includes(k); return `<div class="mini${own ? "" : " lock"}"><i>${numOf(k)}</i>${ic(k)}</div>`; }).join("")}</div>
      <p class="dcap">3 of 10 types found</p>` },
};
const sw = document.getElementById("sw");
function show(k) {
  [...sw.children].forEach(b => b.setAttribute("aria-pressed", String(b.dataset.k === k)));
  document.getElementById("cap").textContent = V[k].cap;
  document.getElementById("hero").innerHTML = V[k].body() + `<p class="kick">YOUR PLAYER TYPE</p><h2>The Skeptic</h2>
    <p class="line">Games beat your expectations by 1.5 points. The ones you shrug at deserve a real chance.</p>
    ${k === "C" ? "" : `<div class="traits"><span>${"RPG heart"}</span><span>Big heart</span><span>Explorer</span></div>`}`;
  try { history.replaceState(null, "", "#" + k); } catch (e) {}
}
Object.keys(V).forEach(k => { const b = document.createElement("button"); b.dataset.k = k; b.textContent = k; b.onclick = () => show(k); sw.append(b); });
show((location.hash || "#A").slice(1) in V ? location.hash.slice(1) : "A");
</script>
