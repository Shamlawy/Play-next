<meta charset="utf-8">
<title>Player type card demos, round 2</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Poppins:wght@500;600;700;800&family=Cinzel:wght@600;700&display=swap">
<style>
/* Round 2: the owner: "forget about the icons, make the cards similar to them" (a poster of illustrated tarot cards). Every type is an ART card:
   a character picture from the game art, its own colour, thin frame, numeral in a diamond, tilted diamonds, a name plate. Layout and style only, nothing moves.
   Pictures here are the repo's two art files (made-up names, no titles). In the app the picture would come from your own top games. */
:root { color-scheme: dark; --pan:#0a0e1b; --volt:#4DA3FF; --vrgb:77,163,255; --ice:#EAF2FF; --mute:#7C92C4; --line:rgba(234,242,255,.14); --font:"Poppins",system-ui,sans-serif; --serif:"Cinzel",Georgia,serif; }
* { box-sizing:border-box; }
html { background:#000; }
body { margin:0; padding:14px 16px 40px; color:var(--ice); font:500 14px/1.4 var(--font); background:radial-gradient(120% 50% at 50% -10%, rgba(var(--vrgb),.13), transparent 60%), #000; }
.sw { display:flex; gap:8px; justify-content:center; margin:6px 0 14px; }
.sw button { font:700 13px var(--font); color:var(--mute); background:var(--pan); border:1px solid var(--line); border-radius:999px; padding:9px 16px; }
.sw button[aria-pressed=true] { background:var(--volt); color:#06101f; border-color:var(--volt); }
.cap { text-align:center; color:var(--mute); font-size:12.5px; margin:0 auto 12px; max-width:350px; }
.hero { max-width:560px; margin:0 auto; border-radius:26px; padding:26px 12px 20px; text-align:center; background:linear-gradient(180deg,#0d1226,#070a15); border:1px solid var(--line); overflow:hidden; }
.kick { font:600 12.5px var(--font); letter-spacing:.14em; color:var(--volt); margin:18px 0 2px; }
.hero h2 { margin:0; font:800 34px/1.05 var(--font); letter-spacing:-.025em; }
.line { color:#cfd9f5; font-size:15px; margin:10px 10px 0; }
.traits { display:flex; gap:8px; justify-content:center; margin-top:14px; flex-wrap:wrap; }
.traits span { padding:6px 11px; border-radius:999px; font:600 12px var(--font); background:rgba(255,255,255,.07); border:1px solid rgba(255,255,255,.1); white-space:nowrap; }
/* the art card */
.tc { --c:77,163,255; position:relative; flex:none; container-type:inline-size; width:min(62vw,250px); aspect-ratio:5/7; background:#07090f; color:#fff; }
.tc::before { content:""; position:absolute; inset:3.2cqw; border:1px solid rgba(255,255,255,.85); z-index:4; pointer-events:none; }   /* the thin white frame */
.tc .tint { position:absolute; inset:3.2cqw; background:linear-gradient(180deg, rgba(var(--c),.26), rgba(var(--c),.04) 60%, rgba(var(--c),.18)); }
.pic { position:absolute; background-repeat:no-repeat; background-color:#10142a; }

.dia { clip-path:polygon(50% 0,100% 50%,50% 100%,0 50%); }
.ol { position:absolute; aspect-ratio:1; transform:rotate(45deg); border:1px solid rgba(255,255,255,.7); z-index:3; pointer-events:none; }
.shade { position:absolute; inset:3.2cqw; z-index:2; background:linear-gradient(0deg,#05070d 0, rgba(5,7,13,.0) 38%); pointer-events:none; }
.num { position:absolute; z-index:5; top:calc(3.2cqw - 6.5cqw); left:50%; width:13cqw; aspect-ratio:1; transform:translateX(-50%) rotate(45deg); background:#07090f; border:1px solid rgba(255,255,255,.85); }
.num b { position:absolute; inset:0; transform:rotate(-45deg); display:grid; place-items:center; font:700 4.6cqw var(--serif); color:#fff; }
.plate { position:absolute; z-index:5; left:50%; bottom:6.4cqw; transform:translateX(-50%); min-width:56%; padding:1.8cqw 3cqw; text-align:center; font:700 5.4cqw/1 var(--serif); color:#fff; white-space:nowrap; background:rgb(calc(var(--r)*.38),calc(var(--g)*.38),calc(var(--b)*.38)); border:1px solid rgba(var(--c),.95); }
.tc[data-lock] { filter:grayscale(1) brightness(.55); }
/* A: break-out diamond (the diamond is wider than the frame and pokes through it) */
.A .back { position:absolute; left:50%; top:47%; width:104%; aspect-ratio:1; transform:translate(-50%,-50%); background:rgba(var(--c),.34); z-index:1; }
.A .pic { left:50%; top:46%; width:92%; aspect-ratio:1; transform:translate(-50%,-50%); z-index:2; }
.A .ol { left:50%; top:46%; width:66%; margin:-33% 0 0 -33%; }
/* B: full art in the frame, colour wash, thin diamond across it */
.B .pic { inset:3.2cqw; z-index:1; }
.B .wash { position:absolute; inset:3.2cqw; z-index:2; background:rgb(var(--c)); mix-blend-mode:soft-light; opacity:.8; }
.B .ol { left:50%; top:44%; width:64%; margin:-32% 0 0 -32%; }
/* C: two diamonds, the big one pale, the art in a smaller one that slides out of it */
.C .back { position:absolute; left:46%; top:48%; width:96%; aspect-ratio:1; transform:translate(-50%,-50%); background:linear-gradient(135deg, rgba(var(--c),.6), rgba(var(--c),.08)); z-index:1; }
.C .pic { left:56%; top:42%; width:66%; aspect-ratio:1; transform:translate(-50%,-50%); z-index:2; }
.C .ol { left:42%; top:56%; width:50%; margin:-25% 0 0 -25%; transform:rotate(20deg); }
.C .ol.o2 { left:56%; top:42%; width:66%; margin:-33% 0 0 -33%; transform:rotate(45deg); }
/* D: the deck */
.deck { display:grid; grid-template-columns:repeat(4,1fr); gap:20px 12px; margin:26px 2px 0; }
.deck .tc { width:100%; }
.dcap { margin:14px 0 0; color:var(--mute); font-size:12.5px; }
.big { display:flex; justify-content:center; }
</style>
<div class="sw" id="sw"></div>
<p class="cap" id="cap"></p>
<section class="hero" id="hero"></section>
<script>
const IMG = { k: [754, 760], c: [900, 507] };
/* type: name, picture file, where in it (cx, cy as fractions), zoom, colour r,g,b */
const T = [
  ["Oracle", "c", .5, .24, 3.4, [92,150,255]], ["Optimist", "k", .26, .2, 2.7, [255,170,70]], ["Skeptic", "k", .76, .1, 2.7, [186,120,255]],
  ["Devotee", "k", .1, .58, 3, [70,215,190]], ["Tough critic", "c", .7, .27, 3.4, [255,100,110]], ["Big heart", "c", .9, .3, 3.4, [255,120,175]],
  ["Collector", "c", .09, .3, 3.4, [170,205,90]], ["Finisher", "k", .9, .5, 3, [240,200,90]], ["Explorer", "k", .44, .3, 2.5, [255,150,90]], ["Duelist", "c", .27, .28, 3.4, [220,70,70]]];
const NUM = ["I","II","III","IV","V","VI","VII","VIII","IX","X"];
/* background-size / -position that put point (cx, cy) of the picture in the middle of a box of ratio r = h / w, zoomed z times the box width */
function pos(f, cx, cy, z, r) { const [w, h] = IMG[f], a = h / w, bh = z * a, cl = v => Math.max(0, Math.min(1, v)), py = cl((cy * bh - r / 2) / (bh - r)), px = cl((cx * z - .5) / (z - 1)); return `background-size:${z * 100}% auto;background-position:${(px * 100).toFixed(1)}% ${(py * 100).toFixed(1)}%`; }
function card(i, kind, lock) {
  const [name, f, cx, cy, z, col] = T[i], c = col.join(",");
  const st = `--c:${c};--r:${col[0]};--g:${col[1]};--b:${col[2]}`;
  const pic = (cls, r, extra = "") => `<i class="pic ${f} ${cls}" style="${pos(f, cx, cy, z, r)}${extra}"></i>`;
  let inner = "";
  if (kind === "A") inner = `<i class="tint"></i><i class="back dia"></i>${pic("dia", 1)}<i class="ol"></i><i class="shade"></i>`;
  if (kind === "B") inner = `${pic("", 1.4 * 1 - .0, "")}<i class="wash"></i><i class="ol"></i><i class="shade"></i>`;
  if (kind === "C") inner = `<i class="tint"></i><i class="back dia"></i>${pic("dia", 1)}<i class="ol"></i><i class="ol o2"></i><i class="shade"></i>`;
  return `<div class="tc ${kind}" style="${st}"${lock ? " data-lock" : ""}>${inner}<span class="num"><b>${NUM[i]}</b></span><span class="plate">${name}</span></div>`;
}
const MY = 2;
const V = {
  A: { cap: "A · Break-out: the character sits in a big tilted diamond that pokes out through the thin frame, a second diamond line over it, the type's own colour.", body: () => `<div class="big">${card(MY, "A")}</div>` },
  B: { cap: "B · Full art: the character fills the whole card under a colour wash, a thin diamond across it, a dark fade into the name plate.", body: () => `<div class="big">${card(MY, "B")}</div>` },
  C: { cap: "C · Two diamonds: a pale colour diamond behind, the character in a smaller one sliding out of it, and a tilted outline crossing them.", body: () => `<div class="big">${card(MY, "C")}</div>` },
  D: { cap: "D · Your deck: your type big (style A), and under it all 10 types as cards like the poster. The ones you haven't found yet are grey.",
    body: () => `<div class="big">${card(MY, "A")}</div><div class="deck">${T.map((_, i) => card(i, "A", ![2, 5, 8, 1].includes(i))).join("")}</div><p class="dcap">4 of 10 types found</p>` },
};
const sw = document.getElementById("sw");
function show(k) {
  [...sw.children].forEach(b => b.setAttribute("aria-pressed", String(b.dataset.k === k)));
  document.getElementById("cap").textContent = V[k].cap;
  document.getElementById("hero").innerHTML = V[k].body() + `<p class="kick">YOUR PLAYER TYPE</p><h2>The Skeptic</h2>
    <p class="line">Games beat your expectations by 1.5 points. The ones you shrug at deserve a real chance.</p>
    <div class="traits"><span>RPG heart</span><span>Big heart</span><span>Explorer</span></div>`;
}
Object.keys(V).forEach(k => { const b = document.createElement("button"); b.dataset.k = k; b.textContent = k; b.onclick = () => show(k); sw.append(b); });
show("A");
</script>
