<title>Ticket demos</title>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
/* Round 1 of the Queue ticket (the owner, Nov 12, after android-v32: "Still looks bad now the cut snaps but the lines are far and looks
   bad in general fix it but show me 4 demos"). Made-up numbers; the picture is repo-root art, no titles. Each option shows a closed row's
   ticket for a played, a playing and a coming game, then the open card's bigger ticket for a played game. */
@font-face { font-family: P; src: url(../../../android/app/src/main/res/font/poppins_600.ttf); font-weight: 600; }
@font-face { font-family: P; src: url(../../../android/app/src/main/res/font/poppins_700.ttf); font-weight: 700; }
* { box-sizing: border-box; }
body { margin: 0; background: #05070f; color: #eaf2ff; font-family: P, sans-serif; width: 860px; padding: 24px; }
h2 { margin: 0 0 4px; font-size: 24px; font-weight: 700; }
p.say { margin: 0 0 14px; font-size: 15px; font-weight: 600; color: rgba(234,242,255,.7); }
.opt { margin-bottom: 34px; }
.stage { position: relative; border-radius: 22px; overflow: hidden; padding: 22px 26px; display: grid; gap: 18px;
  background: linear-gradient(90deg, rgba(5,8,16,.92) 0%, rgba(5,8,16,.62) 55%, rgba(5,8,16,.8)), url(../../../fefw-key-art.jpg) center 30% / cover; }
.rows { display: flex; gap: 22px; align-items: center; flex-wrap: wrap; }
.lab { font-size: 12px; font-weight: 600; color: rgba(234,242,255,.55); margin-bottom: 6px; }

/* a ticket: two cells; sizes r (row) and c (card) */
.tk { display: inline-flex; position: relative; --bg: #05070f; }
.tk > i { font-style: normal; display: flex; flex-direction: column; justify-content: center; position: relative; }
.tk b { font-weight: 700; white-space: nowrap; color: #eaf2ff; }
.tk small { font-weight: 600; white-space: nowrap; color: rgba(234,242,255,.66); }
.tk.r { height: 62px; } .tk.r > i { padding: 0 13px; min-width: 72px; align-items: center; } .tk.r b { font-size: 16px; } .tk.r small { font-size: 11.5px; }
.tk.c { height: 88px; } .tk.c > i { padding: 0 20px; } .tk.c b { font-size: 32px; line-height: 1; letter-spacing: -.03em; } .tk.c small { font-size: 12.5px; margin-top: 4px; }
.tk.r > i { background: color-mix(in srgb, var(--a) 26%, rgba(5,8,16,.88)); }
.tk.c > .s { background: linear-gradient(160deg, var(--a), color-mix(in srgb, var(--a) 68%, #05070f)); }
.tk.c > .s b { color: #fff; text-shadow: 0 1px 6px rgba(0,0,0,.35); } .tk.c > .s small { color: rgba(255,255,255,.85); }
.tk.c > .b { background: color-mix(in srgb, var(--a) 30%, #0b0f1e); }
.tk.c { filter: drop-shadow(0 10px 20px rgba(0,0,0,.45)); }

/* NOW (android-v32): the stub hangs torn, the line 8-9px inside the body */
.now .tk.r > i { border: 1px solid color-mix(in srgb, var(--a) 55%, transparent); }
.now .tk.r > .s { border-radius: 12px 0 0 12px; } .now .tk.r > .b { border-radius: 0 12px 12px 0; }
.now .tk.c > .s { border-radius: 12px 0 0 12px; } .now .tk.c > .b { border-radius: 0 12px 12px 0; }
.now .tk.torn > .s { transform-origin: 100% 0; transform: translate(-5px, 4px) rotate(-6deg); border-radius: 12px 2px 4px 12px; }
.now .tk.c.torn > .s { transform-origin: 0 100%; transform: translate(-5px, 4px) rotate(8deg); }
.now .tk.c.torn > .b { transform: translateX(4px); }
.now .tk > .b::before { content: ""; position: absolute; top: 2px; bottom: 2px; left: 0; border-left: 2px dashed color-mix(in srgb, var(--a) 50%, rgba(255,255,255,.35)); }
.now .tk.torn > .b::before { left: 8px; } .now .tk.torn > .b { padding-left: 21px; } .now .tk.c.torn > .b { padding-left: 29px; }

/* A · One ticket: never tears; one outline, the notches and the dashed line right on the seam */
.A .tk > .s { border-radius: 12px 0 0 12px; -webkit-mask: radial-gradient(circle 7px at 100% 0, #0000 6.5px, #000 7px) 0 0 / 100% 51% no-repeat, radial-gradient(circle 7px at 100% 100%, #0000 6.5px, #000 7px) 0 100% / 100% 51% no-repeat; }
.A .tk > .b { border-radius: 0 12px 12px 0; -webkit-mask: radial-gradient(circle 7px at 0 0, #0000 6.5px, #000 7px) 0 0 / 100% 51% no-repeat, radial-gradient(circle 7px at 0 100%, #0000 6.5px, #000 7px) 0 100% / 100% 51% no-repeat; }
.A .tk > .b::before { content: ""; position: absolute; top: 9px; bottom: 9px; left: 0; border-left: 2px dashed color-mix(in srgb, var(--a) 45%, rgba(255,255,255,.5)); }
.A .tk.r { filter: drop-shadow(0 0 .6px color-mix(in srgb, var(--a) 90%, transparent)) drop-shadow(0 0 .6px color-mix(in srgb, var(--a) 90%, transparent)); }

/* B · Ripped: the stub is torn off and hangs; both torn sides are a jagged paper edge, no dashed line at all */
.B .tk > .s { border-radius: 12px 0 0 12px; }
.B .tk > .b { border-radius: 0 12px 12px 0; }
.B .tk.torn > .s { transform-origin: 100% 0; transform: translate(-6px, 4px) rotate(-6deg); }
.B .tk.c.torn > .s { transform-origin: 0 100%; transform: translate(-6px, 5px) rotate(7deg); }
.B .tk.r > .s, .B .tk.r > .b { }
.B .tk .s.zz { clip-path: var(--zs); } .B .tk .b.zz { clip-path: var(--zb); }
.B .tk:not(.torn) > .b::before { content: ""; position: absolute; top: 9px; bottom: 9px; left: 0; border-left: 2px dashed color-mix(in srgb, var(--a) 45%, rgba(255,255,255,.5)); }
.B .tk.r { filter: drop-shadow(0 0 .6px var(--a)) drop-shadow(0 0 .6px var(--a)); }
.B .tk.torn > .b { padding-left: 19px; } .B .tk.c.torn > .b { padding-left: 26px; }

/* C · Punched: never tears; the perforation is a column of punched holes on the seam, and a played game's stub gets a punch through it */
.C .tk > .s { border-radius: 12px 0 0 12px; }
.C .tk > .b { border-radius: 0 12px 12px 0; }
.C .tk > .b { -webkit-mask: radial-gradient(circle 3px at 0 50%, #0000 2.6px, #000 3px) 0 3px / 100% 11px repeat-y,
  linear-gradient(#000 0 0) 4px 0 / 100% 100% no-repeat; -webkit-mask-composite: source-over; }
.C .tk > .s { -webkit-mask: radial-gradient(circle 3px at 100% 50%, #0000 2.6px, #000 3px) 0 3px / 100% 11px repeat-y; }
.C .tk.torn > .s { -webkit-mask: radial-gradient(circle 3px at 100% 50%, #0000 2.6px, #000 3px) 0 3px / 100% 11px repeat-y,
  radial-gradient(circle 5px at 13px 13px, #0000 4.5px, #000 5px); -webkit-mask-composite: source-in; mask-composite: intersect; }
.C .tk.c.torn > .s { -webkit-mask: radial-gradient(circle 3px at 100% 50%, #0000 2.6px, #000 3px) 0 3px / 100% 11px repeat-y,
  radial-gradient(circle 7px at 17px 17px, #0000 6.5px, #000 7px); -webkit-mask-composite: source-in; mask-composite: intersect; }
.C .tk.r { filter: drop-shadow(0 0 .6px var(--a)) drop-shadow(0 0 .6px var(--a)); }

/* D · Clean divider: one rounded ticket, a short soft line in the middle (it never reaches the edges), small notches top and bottom; no tear */
.D .tk { border-radius: 14px; overflow: hidden; }
.D .tk.r { border: 1px solid color-mix(in srgb, var(--a) 55%, transparent); border-radius: 14px; }
.D .tk > .b::before { content: ""; position: absolute; top: 26%; bottom: 26%; left: -1px; width: 2px; border-radius: 1px; background: color-mix(in srgb, var(--a) 40%, rgba(255,255,255,.45)); }
.D .tk > .s { -webkit-mask: radial-gradient(circle 6px at 100% 0, #0000 5.5px, #000 6px) 0 0 / 100% 51% no-repeat, radial-gradient(circle 6px at 100% 100%, #0000 5.5px, #000 6px) 0 100% / 100% 51% no-repeat; }
.D .tk > .b { -webkit-mask: radial-gradient(circle 6px at 0 0, #0000 5.5px, #000 6px) 0 0 / 100% 51% no-repeat, radial-gradient(circle 6px at 0 100%, #0000 5.5px, #000 6px) 0 100% / 100% 51% no-repeat; }
.D .tk.r { border: 0; filter: drop-shadow(0 0 .6px var(--a)) drop-shadow(0 0 .6px var(--a)); }
</style>
<body>
<script>
const opts = [
  ["now", "Now (v32)", "What's on your phone: the stub hangs torn, the line sits away from the edge."],
  ["A", "A · One ticket", "Never tears. One outline, the dashed line and the two notches right on the join."],
  ["B", "B · Ripped", "Played games still tear, but both torn sides are a jagged paper edge. No dashed line."],
  ["C", "C · Punched", "Never tears. The tear line is a row of little punched holes; a played game's stub gets a hole punched in it."],
  ["D", "D · Clean", "One rounded ticket, a short soft line in the middle that never reaches the edges, small notches top and bottom."],
];
const T = (k, a, s, b, torn) => `<span class="tk ${k}${torn ? " torn" : ""}" style="--a:${a}"><i class="s zz"><b>${s[0]}</b><small>${s[1]}</small></i><i class="b zz"><b>${b[0]}</b><small>${b[1]}</small></i></span>`;
let h = "";
for (const [c, name, say] of opts) {
  h += `<div class="opt ${c}"><h2>${name}</h2><p class="say">${say}</p><div class="stage">
    <div><div class="lab">Closed rows: played · playing · coming</div><div class="rows">
      ${T("r", "#9aa6be", ["63", "my score"], ["1×", "played"], true)}
      ${T("r", "#8c9cc0", ["0%", "done"], ["76 h", "left"], true)}
      ${T("r", "#c9a23a", ["14 Nov", "2026"], ["18 days", "to go"], false)}
    </div></div>
    <div><div class="lab">Open card: played · coming</div><div class="rows">
      ${T("c", "#e8365a", ["60", "my score"], ["1×", "played"], true)}
      ${T("c", "#c9a23a", ["14 Nov", "2026"], ["18 days", "to go"], false)}
    </div></div></div></div>`;
}
document.body.innerHTML = h;
// B's jagged edges: a zigzag on the stub's right side and the body's left side, 6px teeth
for (const tk of document.querySelectorAll(".B .tk.torn")) {
  const H = tk.classList.contains("c") ? 88 : 62, n = Math.round(H / 7), st = H / n, d = 5;
  const zs = [], zb = [];
  for (let k = 0; k <= n; k++) { const y = k * st, o = k % 2 ? d : 0; zs.push(`calc(100% - ${o}px) ${y}px`); zb.push(`${d - o}px ${y}px`); }
  tk.style.setProperty("--zs", `polygon(0 0, ${zs.join(",")}, 0 100%)`);
  tk.style.setProperty("--zb", `polygon(${zb.join(",")}, 100% 100%, 100% 0)`);
}
</script>
</body>
