<!doctype html>
<!-- Demo (idea M42, the skills book), round 2: the Book tab next to Insights. A deterministic page: seek(t) draws the moment t seconds
     in (the book rises in, the foil cover catches the light and swings open with weight, the pages curl past to the latest game,
     the landed page fills in, then a finger peels one page over), so tools/demos/skills/book-render.mjs can film it frame by frame.
     Each turning page is cut into strips at slightly different angles, so it bends like paper; a shade and a highlight move along it.
     Games and words come from window.BOOK (a private DATA file); the made-up ones below are the default. Only transform and opacity
     move. Not part of the app. -->
<html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@500;600;700;800&display=block" rel="stylesheet">
<style>
:root { --bg: #000; --paper: #10172a; --paper2: #151d35; --line: rgba(234,242,255,.09); --line2: rgba(234,242,255,.16); --ice: #eaf2ff; --mute: #8fa0c2; --volt: #4da3ff;
  --foil: linear-gradient(115deg, #8aa8ec 0%, #f4f8ff 28%, #7d9de6 46%, #dfe9ff 66%, #9bb5ef 84%, #f4f8ff 100%);
  --f: "Poppins", system-ui, sans-serif; }
html, body { margin: 0; height: 100%; background: var(--bg); overflow: hidden; }
body { font: 500 13px/1.45 var(--f); color: var(--ice); }
body::before { content: ""; position: fixed; inset: 0; background: radial-gradient(120% 70% at 50% 0%, rgba(40,90,200,.3), transparent 60%); }
.scr { position: relative; height: 100%; display: flex; flex-direction: column; }
.hd { padding: 26px 28px 0; position: relative; }
.hd h1 { margin: 0; font: 700 30px/1.15 var(--f); letter-spacing: -.015em; }
.hd p { margin: 4px 0 0; color: var(--mute); font-size: 13.5px; }
.desk { flex: 1; display: grid; place-items: center; min-height: 0; position: relative; }
.glow { position: absolute; left: 50%; top: 52%; width: 90%; height: 70%; transform: translate(-50%, -50%); background: radial-gradient(closest-side, rgba(77,163,255,.22), transparent); opacity: 0; pointer-events: none; }
.book { position: relative; width: var(--W); height: var(--H); perspective: 2200px; }
.floor { position: absolute; left: 4%; right: 4%; bottom: -26px; height: 40px; border-radius: 50%; background: radial-gradient(closest-side, rgba(0,0,0,.85), transparent); }
.pg { position: absolute; top: 0; width: 50%; height: 100%; box-sizing: border-box; overflow: hidden; }
.pg.l { left: 0; border-radius: 16px 4px 4px 16px; }
.leaf, .st { position: absolute; top: 0; height: 100%; transform-origin: 0 50%; transform-style: preserve-3d; }
.leaf { left: 50%; width: 50%; }
.st > .face { position: absolute; inset: 0; backface-visibility: hidden; -webkit-backface-visibility: hidden; overflow: hidden; }
.st > .bk { transform: rotateY(180deg); }
.st > .fr.end { border-radius: 0 16px 16px 0; } .st > .bk.end { border-radius: 16px 0 0 16px; }
.st > .fr.one { border-radius: 4px 16px 16px 4px; } .st > .bk.one { border-radius: 16px 4px 4px 16px; }
.pgc { position: absolute; top: 0; height: 100%; }
.pgc.fr { background: linear-gradient(90deg, #070b17, var(--paper) 7%, var(--paper) 94%, #0c1222); }
.pgc.bk { background: linear-gradient(270deg, #070b17, var(--paper) 7%, var(--paper) 94%, #0c1222); }
.face > i { position: absolute; inset: 0; opacity: 0; }
.face > .s0 { background: #000; } .face > .s1 { background: linear-gradient(90deg, transparent, #000); } .face > .s2 { background: linear-gradient(270deg, transparent, #000); }
.face > .g0 { background: rgb(200,225,255); } .face > .g1 { background: linear-gradient(90deg, transparent, rgb(200,225,255)); } .face > .g2 { background: linear-gradient(270deg, transparent, rgb(200,225,255)); }
.cast { position: absolute; top: 0; width: 50%; height: 100%; pointer-events: none; opacity: 0; }
.cast.r { left: 50%; background: linear-gradient(90deg, rgba(0,0,0,.7), transparent 75%); border-radius: 4px 16px 16px 4px; }
.cast.l { left: 0; background: linear-gradient(270deg, rgba(0,0,0,.7), transparent 75%); border-radius: 16px 4px 4px 16px; }
.block { position: absolute; top: 5px; bottom: 5px; width: 9px; border-radius: 3px; background: repeating-linear-gradient(90deg, #26314f 0 1px, #0d1324 1px 2px); }
.gutter { position: absolute; left: 50%; top: 0; bottom: 0; width: 40px; margin-left: -20px; background: linear-gradient(90deg, transparent, rgba(0,0,0,.45) 50%, transparent); pointer-events: none; z-index: 900; opacity: 0; }
/* page contents */
.in { position: absolute; inset: 0; padding: 26px 26px 30px 30px; display: flex; flex-direction: column; gap: 11px; }
.bk .in, .pg.l .in { padding: 26px 30px 30px 26px; }
.folio { position: absolute; bottom: 12px; font: 600 10.5px/1 var(--f); color: var(--mute); opacity: .7; }
.fr .folio { right: 22px; } .bk .folio { left: 22px; }
.kick { font: 600 11px/1.2 var(--f); color: var(--volt); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
h2 { margin: 0; font: 700 21px/1.18 var(--f); letter-spacing: -.015em; text-wrap: balance; }
/* skill tile: look A (Perks), the owner's pick */
.sk { padding: 12px 13px; border-radius: 14px; background: var(--paper2); border: 1px solid var(--line); }
.skt { display: flex; align-items: center; gap: 10px; }
.dia { width: 36px; height: 36px; display: grid; place-items: center; flex: none; position: relative; color: #fff; }
.dia::before { content: ""; position: absolute; inset: 4px; transform: rotate(45deg); border-radius: 7px; background: var(--a); }
.dia svg { position: relative; width: 19px; height: 19px; }
.kk { display: flex; align-items: center; gap: 7px; font: 600 11px/1.2 var(--f); color: var(--volt); white-space: nowrap; }
.pips { display: flex; gap: 3px; align-items: center; }
.pips i { width: 16px; height: 5px; border-radius: 3px; background: var(--line2); overflow: hidden; display: block; }
.pips i b { display: block; height: 100%; background: var(--volt); border-radius: 3px; transform-origin: 0 50%; }
.pips span { font: 600 10.5px/1 var(--f); color: var(--mute); margin-left: 4px; }
.g { font: 700 14px/1.28 var(--f); letter-spacing: -.01em; margin-top: 3px; text-wrap: balance; }
.sk dl { display: grid; grid-template-columns: 68px 1fr; gap: 4px 8px; margin: 9px 0 0; padding-top: 8px; border-top: 1px solid var(--line); }
.sk dt { font: 600 10.5px/1.45 var(--f); color: var(--mute); white-space: nowrap; }
.sk dd { margin: 0; font: 500 11px/1.45 var(--f); color: rgba(234,242,255,.84); }
.sk dt.life { color: var(--volt); } .sk dd.life { color: var(--ice); font-weight: 600; }
/* art page: the game's own colour (the app uses the game's key art here) */
.art { position: absolute; inset: 0; background: linear-gradient(160deg, var(--c) 0%, rgba(0,0,0,.2) 55%, #070b16 100%); overflow: hidden; }
.art::before { content: ""; position: absolute; inset: 0; background: repeating-linear-gradient(115deg, rgba(255,255,255,.05) 0 2px, transparent 2px 22px); }
.art .emb { position: absolute; left: 50%; top: 38%; width: 46%; aspect-ratio: 1; transform: translate(-50%, -50%) rotate(45deg); border-radius: 22%; border: 2px solid rgba(255,255,255,.35); background: rgba(0,0,0,.18); }
.art .emb::after { content: ""; position: absolute; inset: 18%; border-radius: 22%; background: rgba(255,255,255,.12); }
.art .glint { position: absolute; top: -20%; bottom: -20%; left: 0; width: 40%; background: linear-gradient(100deg, transparent, rgba(255,255,255,.32) 50%, transparent); transform: translateX(-120%) skewX(-12deg); }
.art .ttl { position: absolute; left: 26px; right: 30px; bottom: 54px; font: 700 26px/1.12 var(--f); letter-spacing: -.02em; text-wrap: balance; }
.art .meta { position: absolute; left: 26px; bottom: 30px; font: 600 11.5px/1 var(--f); color: rgba(234,242,255,.8); white-space: nowrap; }
.art .note { position: absolute; left: 26px; top: 22px; font: 600 10px/1 var(--f); color: rgba(234,242,255,.55); }
.seal { position: absolute; left: 50%; top: 38%; transform: translate(-50%, -50%); width: 64px; height: 64px; border-radius: 50%; background: #0a0f1d; display: grid; place-items: center; color: var(--mute); border: 1px solid var(--line); }
/* the cover: navy leather, an embossed double frame, a foil crest and foil lettering, the three top skills as foil badges */
.cover { position: absolute; inset: 0; overflow: hidden; background: radial-gradient(130% 90% at 28% 18%, #22428f 0%, #11245a 42%, #081131 78%, #050a1f 100%); }
.cover .grain { position: absolute; inset: 0; opacity: .5; background: repeating-radial-gradient(circle at 30% 30%, rgba(255,255,255,.025) 0 1px, transparent 1px 3px), repeating-linear-gradient(35deg, rgba(0,0,0,.08) 0 2px, transparent 2px 5px); }
.cover .spine { position: absolute; left: 0; top: 0; bottom: 0; width: 22px; background: linear-gradient(90deg, #040817, #0d1b45 60%, rgba(0,0,0,.25)); }
.cover .spine::before, .cover .spine::after { content: ""; position: absolute; left: 3px; right: 5px; height: 3px; border-radius: 2px; background: var(--foil); opacity: .55; }
.cover .spine::before { top: 9%; } .cover .spine::after { bottom: 9%; }
.cover .frame { position: absolute; inset: 18px 18px 18px 36px; border-radius: 12px; border: 1.5px solid rgba(178,205,255,.5);
  box-shadow: 0 1px 0 rgba(255,255,255,.07), inset 0 2px 3px rgba(0,0,0,.55), inset 0 0 0 6px rgba(4,9,26,.35), inset 0 0 0 7px rgba(178,205,255,.22); }
.cover .crn { position: absolute; width: 30px; height: 30px; }
.cover .vol { position: absolute; left: 36px; right: 18px; top: 40px; text-align: center; font: 600 11px/1 var(--f); letter-spacing: .08em; color: rgba(200,220,255,.7); }
.cover .crest { position: absolute; left: calc(50% + 9px); top: 30%; width: 40%; aspect-ratio: 1; transform: translate(-50%, -50%); }
.cover .t { position: absolute; left: 54px; right: 36px; top: 52%; text-align: center; font: 800 31px/1.08 var(--f); letter-spacing: -.02em; text-wrap: balance;
  background: var(--foil); -webkit-background-clip: text; background-clip: text; color: transparent; filter: drop-shadow(0 1.5px 0 rgba(0,0,0,.6)); }
.cover .s { position: absolute; left: 54px; right: 36px; top: calc(52% + 82px); text-align: center; color: rgba(214,228,255,.72); font-size: 12px; }
.cover .rule { position: absolute; left: calc(50% + 9px); top: calc(52% + 70px); width: 90px; height: 1.5px; margin-left: -45px; background: var(--foil); opacity: .6; }
.cover .badges { position: absolute; left: 50px; right: 32px; bottom: 50px; display: flex; flex-wrap: wrap; justify-content: center; gap: 7px; }
.bdg { display: inline-flex; align-items: center; gap: 6px; font: 600 11px/1 var(--f); color: #e9f1ff; padding: 7px 11px 7px 8px; border-radius: 999px; white-space: nowrap;
  border: 1px solid transparent; background: linear-gradient(#0c1940, #0c1940) padding-box, var(--foil) border-box; }
.bdg svg { width: 14px; height: 14px; color: #c9dbff; }
.cover .sheen { position: absolute; top: -30%; bottom: -30%; left: 0; width: 46%; background: linear-gradient(100deg, transparent 10%, rgba(220,235,255,.28) 48%, rgba(255,255,255,.42) 50%, rgba(220,235,255,.28) 52%, transparent 90%); transform: translateX(-130%) skewX(-14deg); }
/* inside of the cover: endpaper and a bookplate */
.endp { position: absolute; inset: 0; background: #0b1533; }
.endp::before { content: ""; position: absolute; inset: 0; opacity: .55; background:
  repeating-linear-gradient(45deg, rgba(120,160,240,.13) 0 1px, transparent 1px 22px), repeating-linear-gradient(-45deg, rgba(120,160,240,.13) 0 1px, transparent 1px 22px); }
.plate { position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%); width: 62%; padding: 22px 16px; border-radius: 14px; text-align: center; background: #0f1a3a;
  border: 1px solid transparent; background: linear-gradient(#0f1a3a, #0f1a3a) padding-box, var(--foil) border-box; }
.plate small { display: block; font: 600 10.5px/1.2 var(--f); color: var(--mute); }
.plate b { display: block; margin-top: 8px; font: 700 20px/1.1 var(--f); }
.plate svg { width: 40px; height: 40px; margin: 0 auto 10px; display: block; }
.toc { display: grid; gap: 10px; margin-top: 6px; }
.toc div { display: flex; gap: 10px; align-items: baseline; font-size: 13px; }
.toc div b { font-weight: 600; } .toc div span { margin-left: auto; color: var(--mute); font-size: 11.5px; white-space: nowrap; }
.toc div.sealed { color: var(--mute); }
.big { font: 700 44px/1 var(--f); letter-spacing: -.03em; color: var(--volt); }
.chip { font: 600 11px/1 var(--f); padding: 7px 10px; border-radius: 999px; background: rgba(77,163,255,.16); color: var(--ice); white-space: nowrap; }
.you { border: 1px dashed rgba(234,242,255,.22); border-radius: 14px; padding: 14px; color: var(--mute); font-size: 12px; }
.you b { color: var(--ice); }
/* sparkles over the landed page */
.spk { position: absolute; left: 0; top: 0; width: 30px; height: 30px; margin: -15px 0 0 -15px; color: #eef4ff; opacity: 0; pointer-events: none; z-index: 950; }
/* the Insights sub-tabs, with Book */
.tabs { align-self: center; margin: 0 0 26px; display: flex; gap: 4px; padding: 5px; border-radius: 999px; background: rgba(11,16,32,.92); border: 1px solid var(--line); position: relative; }
.tabs span { font: 700 13px/1 var(--f); padding: 12px 18px; border-radius: 999px; color: var(--mute); white-space: nowrap; }
.tabs span.on { background: var(--volt); color: #04111f; }
.finger { position: absolute; left: 0; top: 0; width: 46px; height: 46px; margin: -23px 0 0 -23px; border-radius: 50%; background: rgba(255,255,255,.26); border: 2px solid rgba(255,255,255,.6); opacity: 0; pointer-events: none; z-index: 999; }
/* folded: one page at a time; the book's left half sits off screen and a turned page leaves to the left */
.fold .desk { justify-items: start; overflow: hidden; }
.fold .art.top { bottom: auto; height: 34%; }
.fold .art.top .emb { width: 26%; top: 46%; }
.fold .art.top .ttl { bottom: 34px; font-size: 22px; } .fold .art.top .meta { bottom: 14px; }
.fold .in.under { top: 34%; padding-top: 14px; }
.fold .cover .t { font-size: 29px; }
</style></head><body>
<div class="scr" id="scr">
  <div class="hd"><h1>Book</h1><p>What your games taught you</p></div>
  <div class="desk"><div class="glow" id="glow"></div><div class="book" id="book"></div></div>
  <div class="tabs"><span>Insights</span><span>Duels</span><span>Friend</span><span class="on">Book</span></div>
  <div class="finger" id="fg"></div>
</div>
<script>
const DEF = { games: [
  { title: "Starfall Odyssey", played: 1, accent: "#7C5CFF", hours: 46, skills: [
    { ic: "time", n: "Prioritising", lv: 3, gain: "Better at prioritising, and at dropping what doesn't matter", txt: "The 60-day voyage never has enough days.", mind: "You practise trade-offs.", life: "You get stuck less on what to do first.", tr: "Pick one thing each morning." }] }],
  cover: ["Prioritising", "Empathy"] };
const B = window.BOOK || DEF;
/* drawn icons, 24x24, fill-only currentColor, one part at .35 (the app's v247/v297 style; same set as shoot.mjs) */
const IC = {
  time: `<path opacity=".35" d="M12 2a10 10 0 1 0 0 20a10 10 0 0 0 0-20z"/><path d="M11 6h2v5.6l3.7 2.2-1 1.7L11 12.7z"/>`,
  bond: `<path opacity=".35" d="M16 11a3.5 3.5 0 1 0 0-7a3.5 3.5 0 0 0 0 7zm0 2c-1.3 0-2.6.3-3.6.8C14 15 15 16.6 15 18.5V20h8v-2c0-2.8-3.6-5-7-5z"/><path d="M8.5 11a3.5 3.5 0 1 0 0-7a3.5 3.5 0 0 0 0 7zM1 20v-1.5C1 15.5 4.6 13 8.5 13S16 15.5 16 18.5V20z"/>`,
  grit: `<path opacity=".35" d="M2 21L9.5 7l3.5 6.5 2.5-4L22 21z"/><path d="M9.5 7L13 13.5l-2 1.3-1.5-2.3L7 14.5 9.5 7zM15.5 9.5L17.6 13l-1.6 1-1.4-2z"/>`,
  eye: `<path opacity=".35" d="M12 5C6.5 5 2.7 9 1.5 12c1.2 3 5 7 10.5 7s9.3-4 10.5-7C21.3 9 17.5 5 12 5z"/><path d="M12 8a4 4 0 1 0 0 8a4 4 0 0 0 0-8z"/>`,
  heart: `<path opacity=".35" d="M12 21s-9-5.6-9-12a5 5 0 0 1 9-3a5 5 0 0 1 9 3c0 6.4-9 12-9 12z"/><path d="M12 9.5l1.4 2.9 3.1.4-2.3 2.1.6 3.1-2.8-1.6-2.8 1.6.6-3.1-2.3-2.1 3.1-.4z"/>`,
  spark: `<path opacity=".35" d="M12 2l2.4 7.6L22 12l-7.6 2.4L12 22l-2.4-7.6L2 12l7.6-2.4z"/><path d="M12 7l1.3 3.7L17 12l-3.7 1.3L12 17l-1.3-3.7L7 12l3.7-1.3z"/>`,
  tactic: `<path opacity=".35" d="M3 3h18v18H3z"/><path d="M6 6h5v5H6zm7 7h5v5h-5z"/>`,
  search: `<path opacity=".35" d="M10 3a7 7 0 1 0 0 14a7 7 0 0 0 0-14z"/><path d="M15.5 14.1l6 6-1.4 1.4-6-6zM10 6a4 4 0 0 1 4 4h-2a2 2 0 0 0-2-2z"/>`,
  clock: `<path opacity=".35" d="M6 2h12v2l-5 8 5 8v2H6v-2l5-8-5-8z"/><path d="M8 20h8l-4-6z"/>`,
  moon: `<path opacity=".35" d="M12 3a9 9 0 1 0 9 9 7 7 0 0 1-9-9z"/><path d="M17 3l.9 2.1L20 6l-2.1.9L17 9l-.9-2.1L14 6l2.1-.9z"/>`,
  lock: `<path opacity=".35" d="M5 10h14v11H5z"/><path d="M8 10V7a4 4 0 0 1 8 0v3h-2V7a2 2 0 0 0-4 0v3z"/>`
};
const svg = k => `<svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">${IC[k] || IC.spark}</svg>`;
const esc = s => String(s || "").replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" })[c]);
const AMT = ["", "some", "a lot", "a core part"];
const played = B.games.filter(g => g.played), sealed = B.games.filter(g => !g.played);
const icOf = n => { for (const g of B.games) for (const s of g.skills) if (s.n === n) return s.ic; return "spark"; };
/* the crest: two foil rings with ticks, an eight-point star and an open book in the middle; an offset dark copy embosses it */
const star = (cx, cy, R, r, n, rot = 0) => Array.from({ length: n * 2 }, (_, i) => { const a = rot + i * Math.PI / n, d = i % 2 ? r : R; return `${(cx + d * Math.sin(a)).toFixed(2)},${(cy - d * Math.cos(a)).toFixed(2)}`; }).join(" ");
const ticks = Array.from({ length: 48 }, (_, i) => `<rect x="59.3" y="9.5" width="1.4" height="${i % 4 ? 3 : 5.5}" transform="rotate(${i * 7.5} 60 60)"/>`).join("");
const crestBody = `<path fill-rule="evenodd" d="M60 2a58 58 0 1 0 0 116A58 58 0 0 0 60 2zm0 3.2a54.8 54.8 0 1 1 0 109.6A54.8 54.8 0 0 1 60 5.2z"/>${ticks}
  <path fill-rule="evenodd" d="M60 18a42 42 0 1 0 0 84A42 42 0 0 0 60 18zm0 2.4a39.6 39.6 0 1 1 0 79.2A39.6 39.6 0 0 1 60 20.4z"/>
  <polygon points="${star(60, 60, 37, 15, 8)}" opacity=".4"/><polygon points="${star(60, 60, 30, 11, 4)}"/>
  ${[45, 135, 225, 315].map(a => `<polygon points="${star(60 + 48 * Math.sin(a * Math.PI / 180), 60 - 48 * Math.cos(a * Math.PI / 180), 4.2, 1.2, 4)}"/>`).join("")}`;
const crest = `<svg class="crest" viewBox="0 0 120 120" aria-hidden="true"><defs><linearGradient id="foil" x1="0" y1="0" x2="1" y2="1">
  <stop offset="0" stop-color="#8aa8ec"/><stop offset=".3" stop-color="#f4f8ff"/><stop offset=".5" stop-color="#7d9de6"/><stop offset=".72" stop-color="#e2ebff"/><stop offset="1" stop-color="#8eaaee"/></linearGradient></defs>
  <g fill="rgba(0,0,0,.55)" transform="translate(1.2 1.8)">${crestBody}</g><g fill="url(#foil)">${crestBody}</g>
  <circle cx="60" cy="60" r="13.5" fill="#0b1637"/><path fill="url(#foil)" d="M50 54.5c3.6-.9 7.1-.3 9.4 1.6v11.6c-2.3-1.7-5.8-2.2-9.4-1.4zm20 0c-3.6-.9-7.1-.3-9.4 1.6v11.6c2.3-1.7 5.8-2.2 9.4-1.4z"/></svg>`;
const corner = rot => `<svg class="crn" viewBox="0 0 30 30" style="${rot}" aria-hidden="true"><g fill="none" stroke="url(#foil)" stroke-width="1.4"><path d="M2 22V8a6 6 0 0 1 6-6h14"/><path d="M7 16v-5a4 4 0 0 1 4-4h5" opacity=".6"/></g><rect x="9.5" y="9.5" width="4" height="4" transform="rotate(45 11.5 11.5)" fill="#c9dbff"/></svg>`;
const nSkills = played.reduce((a, g) => a + g.skills.length, 0);
const cover = `<div class="cover"><div class="grain"></div><div class="spine"></div><div class="frame"></div>
  ${corner("left:44px;top:26px")}${corner("right:26px;top:26px;transform:scaleX(-1)")}${corner("left:44px;bottom:26px;transform:scaleY(-1)")}${corner("right:26px;bottom:26px;transform:scale(-1)")}
  <div class="vol">Volume 1</div>${crest}<div class="t">What my games taught me</div><div class="rule"></div>
  <div class="s">${played.length} games finished · ${nSkills} skills</div>
  <div class="badges">${(B.cover || []).slice(0, 3).map(c => `<span class="bdg">${svg(icOf(c))}${esc(c)}</span>`).join("")}</div><div class="sheen" id="sheen"></div></div>`;
const inside = `<div class="endp"><div class="plate"><svg viewBox="0 0 120 120" aria-hidden="true"><g fill="url(#foil)">${crestBody}</g></svg><small>This book belongs to</small><b>Player 1</b></div></div>`;
const pips = (lv, land) => `<span class="pips">${[1, 2, 3].map(i => `<i>${i <= lv ? `<b class="${land ? "pf" : ""}"></b>` : ""}</i>`).join("")}<span>${AMT[lv]}</span></span>`;
const sk = (s, g, land) => `<div class="sk"><div class="skt"><span class="dia" style="--a:${g.accent}">${svg(s.ic)}</span><div style="min-width:0"><div class="kk">${esc(s.n)}${pips(s.lv, land)}</div>
  <div class="g">${esc(s.gain || s.n)}</div></div></div><dl><dt>In the game</dt><dd>${esc(s.txt)}</dd>${s.mind ? `<dt>In your head</dt><dd>${esc(s.mind)}</dd>` : ""}${s.life ? `<dt class="life">In your life</dt><dd class="life">${esc(s.life)}</dd>` : ""}${s.tr ? `<dt>Try</dt><dd>${esc(s.tr)}</dd>` : ""}</dl></div>`;
const art = (g, top) => `<div class="art${top ? " top" : ""}" style="--c:${g.accent}"><span class="note">the game's key art goes here</span><span class="emb"></span><span class="glint"></span>${g.played ? "" : `<span class="seal">${svg("lock").replace("<svg", '<svg width="26" height="26"')}</span>`}
  <div class="ttl">${esc(g.title)}</div><div class="meta">${g.played ? `Finished · ~${g.hours}h · ${g.skills.length} skills` : "Not played yet · sealed until you finish"}</div></div>`;
/* every page side in reading order. Unfolded: spreads [cover | inside cover, contents | art, skills 1-2 | skills 3-4, what stayed | …].
   Folded: one page at a time, the art as a band on top of the game's first page. The landed game's pips fill in once it lands. */
const fold = innerWidth < 600;
if (fold) document.body.classList.add("fold");
const stayed = g => `<div class="in"><div class="kick">${esc(g.title)} · what stayed</div><h2>${g.skills.length} skills from ~${g.hours} hours</h2>
   <div style="display:flex;flex-wrap:wrap;gap:6px">${g.skills.map(s => `<span class="chip">${esc(s.n)}</span>`).join("")}</div>
   <div class="you"><b>Nexi asked:</b> did anything stick with you?<br><br>Your answer is written here, in your own words.</div></div>`;
const per = 4, toc = [], body = []; let pn = 3;
played.forEach((g, gi) => { toc.push([g.title, pn]); const last = gi === played.length - 1;
  if (fold) body.push(`${art(g, 1)}<div class="in under">${sk(g.skills[0], g, last)}</div>`,
    `<div class="in"><div class="kick">${esc(g.title)}</div>${g.skills.slice(1, 3).map(s => sk(s, g)).join("")}</div>`,
    `<div class="in"><div class="kick">${esc(g.title)}</div>${g.skills.slice(3, 4).map(s => sk(s, g)).join("")}</div>`, stayed(g));
  else body.push(art(g), `<div class="in"><div class="kick">${esc(g.title)}</div>${g.skills.slice(0, 2).map(s => sk(s, g, last)).join("")}</div>`, `<div class="in">${g.skills.slice(2, 4).map(s => sk(s, g)).join("")}</div>`, stayed(g));
  pn += per; });
sealed.forEach(g => { toc.push([g.title, pn, 1]);
  if (fold) body.push(`${art(g, 1)}<div class="in under">${sk(g.skills[0], g)}</div>`);
  else body.push(art(g), `<div class="in"><div class="kick">${esc(g.title)} · sealed</div>${g.skills.slice(0, 2).map(s => sk(s, g)).join("")}</div>`); pn += fold ? 1 : 2; });
const contents = `<div class="in"><div class="kick">Contents</div><div style="display:flex;align-items:baseline;gap:10px"><span class="big">${played.length}</span><h2>games finished, each one left you better at something</h2></div>
  <p style="margin:0;color:var(--mute)">In the order you finished them</p><div class="toc">${toc.map(([t, p, s]) =>
  `<div class="${s ? "sealed" : ""}"><b>${esc(t)}</b><span>${s ? "sealed" : "p. " + p}</span></div>`).join("")}</div></div>`;
const end = `<div class="in" style="justify-content:center;color:var(--mute)">More pages fill in as you finish games.</div>`;
const P = [];
if (fold) { P.push(cover, inside); [contents, ...body, end].forEach(x => P.push(x, `<div class="in"></div>`)); }   /* backs stay plain paper */
else { P.push(cover, inside, contents, ...body, end); if (P.length % 2) P.push(`<div class="in"></div>`); }
/* leaf j: front = P[2j], back = P[2j+1]. Where the reader lands: the first page of the latest finished game */
const N = P.length / 2, land = fold ? 2 + (played.length - 1) * 4 : 2 + (played.length - 1) * 2;
const book = document.getElementById("book");
const W = fold ? (innerWidth - 32) * 2 : Math.min(innerWidth - 56, 980), Wp = W / 2, H = Math.min(innerHeight - 220, fold ? 640 : W * .74 + 40);
if (fold) book.style.marginLeft = (16 - Wp) + "px";
book.style.setProperty("--W", W + "px"); book.style.setProperty("--H", H + "px");
/* a leaf = a chain of strips, each one the next strip's parent, so their small angles add up into a bend.
   Every strip shows its slice of the page (front) and, mirrored, of the back. The cover stays stiff (one strip). */
const S = 10, LAY = `<i class="s0"></i><i class="s1"></i><i class="s2"></i><i class="g0"></i><i class="g1"></i><i class="g2"></i>`;
function leafHTML(j) {
  const n = j === 0 || j > land ? 1 : S, sw = Wp / n; let h = "";
  for (let k = n - 1; k >= 0; k--) {
    const c = n === 1 ? "one" : k === n - 1 ? "end" : "";
    h = `<div class="st" style="left:${k ? sw : 0}px;width:${(sw + (k < n - 1 ? .7 : 0)).toFixed(2)}px">
      <div class="face fr ${c}"><div class="pgc fr" style="width:${Wp}px;left:${(-k * sw).toFixed(2)}px">${P[2 * j]}<span class="folio">${j > 1 ? 2 * j - 1 : ""}</span></div>${LAY}</div>
      <div class="face bk ${c}"><div class="pgc bk" style="width:${Wp}px;left:${(-(Wp - (k + 1) * sw)).toFixed(2)}px">${P[2 * j + 1]}<span class="folio">${j ? 2 * j : ""}</span></div>${LAY}</div>${h}</div>`;
  }
  return `<div class="leaf" id="lf${j}">${h}</div>`;
}
book.innerHTML = `<div class="floor" id="floor"></div><div class="block" id="bl" style="left:-7px"></div><div class="block" id="br" style="right:-7px"></div><div class="cast r" id="cr"></div><div class="cast l" id="cl"></div>` +
  Array.from({ length: N }, (_, j) => leafHTML(j)).join("") + `<div class="gutter" id="gut"></div>`;
const tabs = [...document.querySelectorAll(".tabs span")], fg = document.getElementById("fg");
const L = [...Array(N)].map((_, j) => { const el = document.getElementById("lf" + j), st = [...el.querySelectorAll(".st")];
  return { el, st, f: st.map(s => [[...s.children[0].querySelectorAll(":scope > i")], [...s.children[1].querySelectorAll(":scope > i")]]) }; });
const pf = [...document.querySelectorAll(`#lf${land} .pf`)];
const pfIdx = pf.map(b => [...b.closest(".pgc").querySelectorAll(".pf")].indexOf(b));   /* each page is copied once per strip: count within one copy */
const arts = fold ? [...document.querySelectorAll(`#lf${land} .fr .glint`)] : [...document.querySelectorAll(`#lf${land - 1} .bk .glint`)];
/* sparkles: little four-point stars over the landed game's art */
const SPK = [[.22, .2, 0], [.7, .14, .1], [.5, .5, .22], [.16, .62, .3], [.82, .45, .38], [.36, .33, .5], [.62, .7, .58], [.9, .24, .66]];
const desk = document.querySelector(".desk");
const spk = SPK.map(() => { const d = document.createElement("div"); d.className = "spk"; d.innerHTML = svg("spark"); desk.appendChild(d); return d; });
const cl = x => x < 0 ? 0 : x > 1 ? 1 : x;
const ease = x => (x = cl(x), x < .5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2), out = x => 1 - Math.pow(1 - cl(x), 3), sine = x => .5 - .5 * Math.cos(Math.PI * cl(x));
const D = Math.PI / 180;
/* the timeline, in seconds */
const T = { tap: .45, in: [.7, 1.8], sheen: [1.85, 2.75], open: [2.8, 4.9], riffle: 5.2, land: 9.2, swipe: [11.0, 14.0], len: 15.4 };
T.openLand = T.open[0] + .8 * (T.open[1] - T.open[0]);
/* the cover: a slow, heavy lift, it passes upright and falls flat faster, then a small bounce settles it */
function coverAngle(t) {
  const u = (t - T.open[0]) / (T.open[1] - T.open[0]);
  if (u <= 0) return 0; if (u >= 1) return 180;
  if (u < .8) { const w = u / .8; return w < .55 ? 100 * sine(w / .55) : 100 + 80 * Math.pow((w - .55) / .45, 2); }
  const b = (u - .8) / .2; return 180 - 7 * Math.sin(Math.PI * b) * (1 - b * .6);
}
/* the pages riffle past on their own: each one later and slower than the last, the last one settles */
const RN = land - 1, R = [];
for (let k = 0; k < RN; k++) { const q = RN > 1 ? k / (RN - 1) : 1, dur = .8 + .75 * q * q + (k === RN - 1 ? .35 : 0);
  R.push({ st: T.riffle + (T.land - (.8 + .75 + .35) - T.riffle) * Math.pow(q, 1.25), dur }); }
/* the finger: a peel at the corner, a drag that follows it, then let go */
const DRAG = T.swipe[1] - .95 - T.swipe[0];
function pose(j, t) {   /* [page angle, bend]; bend > 0 = the outer edge trails, < 0 = it leads */
  if (j === 0) return [coverAngle(t), 0];
  if (j < land) { const r = R[j - 1], x = (t - r.st) / r.dur; if (x <= 0) return [0, 0]; if (x >= 1) return [180, 0];
    const a = 180 * (j === RN ? out(x) : ease(x)); return [a, 30 * Math.sin(a * D) * (1 - .4 * x)]; }
  if (j === land) { const [s0, s1] = T.swipe, r = (t - s0) / DRAG;
    if (r <= 0) return [0, 0];
    if (r < 1) { const a = r < .16 ? 9 * sine(r / .16) : 9 + 116 * ease((r - .16) / .84); return [a, -(r < .16 ? 36 * sine(r / .16) : 30) * Math.max(.35, Math.sin(a * D))]; }
    const b = (t - (s1 - .95)) / .95; if (b >= 1) return [180, 0];
    const a = 125 + 55 * out(b); return [a, 30 * Math.sin(a * D) * (-1 + 1.9 * out(b * 1.6))]; }
  return [0, 0];
}
/* light from the upper left: a face darkens as it turns away, and a soft highlight runs along the bend */
const shadeOf = (phi, front) => front ? (phi < 90 ? .55 * Math.pow(Math.sin(phi * D), 1.3) : .55) : (phi >= 90 ? .5 * Math.pow(Math.sin(phi * D), 1.3) : .5);
const glossOf = (phi, front) => front ? (phi > 0 && phi < 90 ? .2 * Math.pow(Math.max(0, Math.cos((phi - 40) * D)), 10) : 0) : (phi > 90 && phi < 180 ? .16 * Math.pow(Math.max(0, Math.cos((phi - 140) * D)), 10) : 0);
/* a value that runs from l (left edge) to r (right edge) of a face = a flat layer of the smaller one + a ramp up to the other */
function ramp([flat, up, down], l, r) { flat.style.opacity = Math.min(l, r).toFixed(3); up.style.opacity = Math.max(0, r - l).toFixed(3); down.style.opacity = Math.max(0, l - r).toFixed(3); }
function setLeaf(o, j, a, bend) {
  const n = o.st.length, phis = [];
  o.el.style.zIndex = a < 90 ? 100 - j : 200 + j;
  for (let k = 0; k < n; k++) { const u = n > 1 ? k / (n - 1) : 0; phis.push(Math.max(0, Math.min(180, a + bend * (.5 - Math.pow(u, 1.3) * 1.4)))); }
  const E = [phis[0], ...phis.slice(1).map((p, k) => (p + phis[k]) / 2), phis[n - 1]];   /* the angle at each strip boundary */
  for (let k = 0; k < n; k++) {
    o.st[k].style.transform = `rotateY(${-(phis[k] - (k ? phis[k - 1] : 0)).toFixed(3)}deg)`;
    const [fr, bk] = o.f[k], e0 = E[k], e1 = E[k + 1];
    /* the front's left edge is the spine side; the back is mirrored, so its left edge is the outer side */
    ramp(fr.slice(0, 3), shadeOf(e0, 1), shadeOf(e1, 1)); ramp(fr.slice(3), glossOf(e0, 1), glossOf(e1, 1));
    ramp(bk.slice(0, 3), shadeOf(e1, 0), shadeOf(e0, 0)); ramp(bk.slice(3), glossOf(e1, 0), glossOf(e0, 0));
  }
  return o.st[n - 1];
}
window.seek = t => {
  /* the book rises out of the dark, tilted back, then sits */
  const p = out((t - T.in[0]) / (T.in[1] - T.in[0]));
  const a0 = coverAngle(t), shift = fold ? 0 : -(Wp / 2) * (1 - Math.min(180, a0) / 180);
  const thump = Math.exp(-Math.pow((t - T.openLand - .05) / .07, 2)) * .006;
  book.style.transform = `translateX(${shift.toFixed(2)}px) translateY(${(60 * (1 - p)).toFixed(2)}px) perspective(1400px) rotateX(${(22 * (1 - p)).toFixed(2)}deg) scale(${(.86 + .14 * p - thump).toFixed(4)})`;
  book.style.opacity = cl((t - T.in[0]) / .5);
  document.getElementById("glow").style.opacity = (.7 * p + .5 * Math.exp(-Math.pow((t - T.land - .3) / .5, 2))).toFixed(3);
  tabs[3].className = t >= T.tap ? "on" : ""; tabs[0].className = t < T.tap ? "on" : "";
  /* the cover's sheen passes once before it opens */
  document.getElementById("sheen").style.transform = `translateX(${(-130 + 360 * sine((t - T.sheen[0]) / (T.sheen[1] - T.sheen[0]))).toFixed(1)}%) skewX(-14deg)`;
  let cast = 0, side = 0, edge = null, top = -1;
  L.forEach((o, j) => { const [a, b] = pose(j, t), last = setLeaf(o, j, a, b);
    if (a > 0 && a < 180) { const c = Math.sin(a * D); if (c > cast) { cast = c; side = a < 90 ? 1 : -1; } }
    if (a >= 180) top = j; if (j === land) edge = [a, last]; });
  document.getElementById("cr").style.opacity = side > 0 ? (cast * .85).toFixed(3) : 0; document.getElementById("cl").style.opacity = side < 0 ? (cast * .85).toFixed(3) : 0;
  document.getElementById("bl").style.opacity = a0 > 90 ? 1 : 0;
  document.getElementById("gut").style.opacity = top >= 0 && !fold ? .9 : 0;
  /* landing: the pips fill in one after another, a glint crosses the art, a few sparkles */
  pf.forEach((b, i) => { b.style.transform = `scaleX(${out((t - T.land - .35 - pfIdx[i] * .09) / .22).toFixed(3)})`; });
  arts.forEach(g => g.style.transform = `translateX(${(-120 + 400 * sine((t - T.land - .1) / .9)).toFixed(1)}%) skewX(-12deg)`);
  const db = desk.getBoundingClientRect();
  const zone = fold ? (() => { const r = book.getBoundingClientRect(); return { left: r.left + Wp, top: r.top, width: Wp, height: H * .34 }; })() :
    (() => { const r = book.getBoundingClientRect(); return { left: r.left, top: r.top, width: Wp, height: H * .6 }; })();
  spk.forEach((d, i) => { const [x, y, dl] = SPK[i], q = (t - T.land - .05 - dl) / .7, v = q > 0 && q < 1 ? Math.sin(Math.PI * q) : 0;
    d.style.transform = `translate(${(zone.left - db.left + zone.width * x).toFixed(1)}px, ${(zone.top - db.top + zone.height * y).toFixed(1)}px) rotate(${(q * 90).toFixed(1)}deg) scale(${(.4 + .8 * v).toFixed(3)})`;
    d.style.opacity = v.toFixed(3); });
  /* the finger, only in the video: the tap on Book, then down on the page's corner, dragging it over, lift */
  const [s0, s1] = T.swipe;
  if (t < T.tap + .35) { const tr = tabs[3].getBoundingClientRect();
    fg.style.transform = `translate(${tr.left + tr.width / 2}px, ${tr.top + tr.height / 2}px) scale(${t < T.tap ? 1 : 1 - .15 * cl((t - T.tap) / .15)})`;
    fg.style.opacity = t < .15 ? t / .15 : t < T.tap ? 1 : Math.max(0, 1 - (t - T.tap) / .35); }
  else if (t > s0 - .4 && t < s1 - .6) { const [a, lastSt] = edge, r = lastSt.getBoundingClientRect(), bx = book.getBoundingClientRect();
    const x = t < s0 ? bx.left + bx.width - 26 : a < 92 ? r.right - 20 : r.left + 20, y = bx.top + bx.height * (.7 - .06 * ease((t - s0) / DRAG));
    fg.style.transform = `translate(${x.toFixed(1)}px, ${y.toFixed(1)}px)`;
    fg.style.opacity = t < s0 ? cl((t - (s0 - .4)) / .3) : t > s1 - .95 ? Math.max(0, 1 - (t - (s1 - .95)) / .3) : 1; }
  else fg.style.opacity = 0;
};
window.LEN = T.len; window.T = T;
/* what happens when, for the sounds: page turns [start, size, length] and the named moments */
window.TURNS = () => R.map((r, k) => [r.st, .5 + .25 * (k / Math.max(1, RN - 1)), r.dur]);
window.EVENTS = () => ({ tap: T.tap, rise: T.in[0], sheen: T.sheen[0], open: T.open[0], openLand: T.openLand, land: T.land, peel: T.swipe[0], release: T.swipe[1] - .95, drop: T.swipe[1] - .2, pips: Math.max(0, ...pfIdx) + 1 });
window.ready = document.fonts.ready.then(() => (seek(0), true));
</script></body></html>
