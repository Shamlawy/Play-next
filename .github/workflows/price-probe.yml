# By hand (Actions tab), or when the probe or the helper changes: fetch real Steam / PlayStation Store data and run the helper's price
# reader on it, so it can be checked against what the stores really send. Raw pages are kept as the "probe" artifact.
name: Price probe
on:
  workflow_dispatch:
    inputs:
      titles:
        description: "Titles, | separated"
        required: false
      ccs:
        description: "Regions, comma separated"
        required: false
      debug:
        description: "Print the raw store search results too (yes/no)"
        required: false
      browser:
        description: "Also record the PS Store website's own search in a headless browser (yes/no)"
        required: false
      art:
        description: "Game pictures: titles to look up (| separated); prints each store's raw search and the live helper's /art"
        required: false
  push:
    paths:
      - ".github/scripts/priceprobe.mjs"
      - ".github/scripts/psprobe.mjs"
      - ".github/scripts/nsprobe.mjs"
      - ".github/scripts/pssearchprobe.mjs"
      - ".github/scripts/artprobe.mjs"
      - "worker/helper.js"
      - ".github/workflows/price-probe.yml"
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Probe
        env:
          TITLES: ${{ github.event.inputs.titles }}
          CCS: ${{ github.event.inputs.ccs }}
          DEBUG: ${{ github.event.inputs.debug == 'yes' && '1' || '' }}
          NS: ${{ github.event.inputs.titles && '1' || '' }}
        run: mkdir -p probe; node .github/scripts/priceprobe.mjs | tee probe/prices.log
      - name: PS search probe
        if: ${{ github.event.inputs.browser == 'yes' }}
        env:
          Q: ${{ github.event.inputs.titles }}
        run: npm i --no-save playwright@1.56.1 >/dev/null 2>&1 && npx playwright install --with-deps chromium >/dev/null 2>&1; node .github/scripts/pssearchprobe.mjs | tee probe/pssearch.log
      - name: Nintendo + Steam probe
        if: ${{ !github.event.inputs.titles }}
        run: node .github/scripts/nsprobe.mjs | tee probe/ns.log
      - name: Art probe
        if: ${{ !github.event.inputs.titles || github.event.inputs.art }}
        env:
          ARTTITLES: ${{ github.event.inputs.art }}
          ARTQ: ${{ github.event.inputs.art }}
        run: set -o pipefail; node .github/scripts/artprobe.mjs | tee probe/art.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: probe
          path: probe/
          retention-days: 7
