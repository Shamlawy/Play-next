# Releases the Android app to the owner's phone. A merge to main that raises release=N in android/version.properties
# releases; one that doesn't builds nothing here (android-check already checked it on the PR). By hand (Run workflow) it
# releases the given ref, so an older ref is a rollback: it still gets a higher version number, so the phone takes it.
#   versionCode = max(N, newest android-v tag + 1), drafts included, so a release that never went out isn't reused.
# On an emulator (16 KB pages when that image exists) it makes the Baseline Profile with the debug-signed build, then builds
# the release signed with the real key (the GitHub secrets, or the Cloudflare KV copy when they're empty), checks the APK's
# certificate against android/signing-cert.txt, creates a DRAFT release (invisible to the phone) with the APK, its .sha256,
# android-latest.txt and the R8 mapping, installs that exact APK on a fresh emulator, walks Home, every tab, a view swipe,
# a game page and Settings with a made-up backup (tools/android-smoke.sh; android-check walks every PR the same way), opens
# the 120 Hz probe and checks the app is still alive 20 s later with no crash. Only then is the release published as
# "latest". A failed smoke test leaves the draft and fails the run. The key file is deleted after the build, before any
# later step runs.
name: Android release
on:
  push:
    branches: [main]
    paths:
      - "android/**"
      - "!android/parity/**"
  workflow_dispatch:
    inputs:
      ref:
        description: "Branch, tag or commit to release (an older one is a rollback; it still gets a higher version number)"
        required: true
        default: main
        type: string
permissions:
  contents: write
concurrency:
  group: android-release
  cancel-in-progress: false
defaults:
  run:
    shell: bash
jobs:
  version:
    name: Which version
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      go: ${{ steps.ver.outputs.go }}
      n: ${{ steps.ver.outputs.n }}
      code: ${{ steps.ver.outputs.code }}
      sha: ${{ steps.ver.outputs.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref || github.sha }}
          filter: blob:none
          sparse-checkout: |
            /android/version.properties
            /android/signing-cert.txt
          sparse-checkout-cone-mode: false
          persist-credentials: false
      - name: "release=N, the newest android-v release (drafts too), the version code"
        id: ver
        env:
          EVENT: ${{ github.event_name }}
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          SHA=$(git rev-parse HEAD)
          F=android/version.properties
          if [ ! -f "$F" ]; then echo "::error::There's no $F at $SHA."; exit 1; fi
          N=$(awk -F= '$1 ~ /^[[:space:]]*release[[:space:]]*$/ { v = $2; gsub(/[[:space:]]/, "", v); print v; exit }' "$F")
          if ! [[ "$N" =~ ^[0-9]{1,9}$ ]]; then echo "::error::$F needs a line release=N (a whole number)."; exit 1; fi
          N=$((10#$N))
          if [ "$N" -lt 1 ]; then echo "::error::release= must be 1 or more."; exit 1; fi

          # every release, drafts included (this token can see drafts), and every android-v tag
          gh api --paginate "repos/$GH_REPO/releases?per_page=100" \
            --jq '.[] | [.tag_name, (if .draft then "draft" else "published" end)] | join(" ")' > "$RUNNER_TEMP/releases.txt"
          gh api --paginate "repos/$GH_REPO/git/matching-refs/tags/android-v" --jq '.[].ref' \
            | sed 's#^refs/tags/##' > "$RUNNER_TEMP/tags.txt"
          awk '{ print $1 }' "$RUNNER_TEMP/releases.txt" > "$RUNNER_TEMP/release-tags.txt"
          cat "$RUNNER_TEMP/release-tags.txt" "$RUNNER_TEMP/tags.txt" \
            | { grep -E '^android-v[0-9]{1,10}$' || true; } | sed 's/^android-v//' | sort -n > "$RUNNER_TEMP/codes.txt"
          LATEST=$(tail -n 1 "$RUNNER_TEMP/codes.txt")
          LATEST=$((10#${LATEST:-0}))
          STUCK=$(awk '$2 == "draft" && $1 ~ /^android-v[0-9]+$/ { printf "%s ", $1 }' "$RUNNER_TEMP/releases.txt")

          if [ "$N" -gt "$LATEST" ]; then CODE=$N; else CODE=$((LATEST + 1)); fi
          go=true
          if [ "$EVENT" = "push" ] && [ "$N" -le "$LATEST" ]; then
            echo "release=$N not raised (the newest is android-v$LATEST): no release"
            if [ -n "$STUCK" ]; then
              echo "::notice::Draft releases that never went out: ${STUCK}(a failed smoke test?). Raise release= in $F, or run this workflow by hand."
            fi
            go=false
          fi
          # Until the one-time key step has run (android-signing-key.yml made the key, its certificate SHA-256 written to
          # android/signing-cert.txt) there is nothing to sign with: wait quietly instead of failing 20 minutes in.
          # The commit that fills signing-cert.txt touches android/, so it starts this release by itself.
          CERT=$(tr -d ':[:space:]' < android/signing-cert.txt 2>/dev/null || true)
          if [ "$go" = true ] && [ -z "$CERT" ]; then
            echo "::notice::No release yet: android/signing-cert.txt is empty, so the signing key hasn't been made. The release starts by itself once that commit lands (docs/ANDROID-PLAN.md, Decisions, question 1)."
            echo "No release: the signing key hasn't been made yet (android/signing-cert.txt is empty)." >> "$GITHUB_STEP_SUMMARY"
            go=false
          fi
          if [ "$go" = true ]; then
            if [ "$CODE" -gt 2100000000 ]; then echo "::error::versionCode $CODE is above Android's limit."; exit 1; fi
            TAG="android-v$CODE"
            if grep -qx "$TAG" "$RUNNER_TEMP/release-tags.txt"; then echo "::error::A release tagged $TAG already exists."; exit 1; fi
            if grep -qx "$TAG" "$RUNNER_TEMP/tags.txt"; then echo "::error::The tag $TAG already exists."; exit 1; fi
            echo "Releasing $SHA as $TAG (release=$N, newest so far android-v$LATEST)"
            echo "Releasing \`$SHA\` as **$TAG** (release=$N, newest before: android-v$LATEST)" >> "$GITHUB_STEP_SUMMARY"
          fi
          {
            echo "go=$go"
            echo "n=$N"
            echo "code=$CODE"
            echo "sha=$SHA"
          } >> "$GITHUB_OUTPUT"

  release:
    name: Build, sign, smoke-test and publish android-v${{ needs.version.outputs.code }}
    needs: version
    if: needs.version.outputs.go == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      CODE: ${{ needs.version.outputs.code }}
      N: ${{ needs.version.outputs.n }}
      SHA: ${{ needs.version.outputs.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.version.outputs.sha }}
          persist-credentials: false
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: "21"
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      # no cache in the job that holds the signing key: every dependency comes fresh, nothing a cache could have planted
      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
        with:
          cache-provider: basic
          cache-disabled: true
          validate-wrappers: true
      - name: Gradle wrapper can run
        run: chmod +x android/gradlew
      - name: Let the emulator use KVM
        run: |
          set -euo pipefail
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules > /dev/null
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Pick the emulator image (16 KB pages if there is one) and a phone shape
        id: avd
        run: |
          set -euo pipefail
          target=google_apis
          if curl -fsS -m 30 -o "$RUNNER_TEMP/sysimg.xml" https://dl.google.com/android/repository/sys-img/google_apis/sys-img2-3.xml \
            && grep -q 'path="system-images;android-36;google_apis_ps16k;x86_64"' "$RUNNER_TEMP/sysimg.xml"; then
            target=google_apis_ps16k
          fi
          profile=""
          AVDM="$ANDROID_HOME/cmdline-tools/latest/bin/avdmanager"
          if [ -x "$AVDM" ]; then
            "$AVDM" list device -c > "$RUNNER_TEMP/devices.txt" 2>/dev/null || true
            for d in pixel_9_pro_fold pixel_fold pixel_9 pixel_8 pixel_7; do
              if grep -qx "$d" "$RUNNER_TEMP/devices.txt"; then profile=$d; break; fi
            done
          fi
          echo "Emulator: android-36 $target x86_64, profile ${profile:-the default}"
          echo "target=$target" >> "$GITHUB_OUTPUT"
          echo "profile=$profile" >> "$GITHUB_OUTPUT"
      # android-v10's first run lost the emulator 95 s into the profile walk while the Gradle and Kotlin daemons (4 GB
      # each) that had just compiled both APKs sat beside it (android-check's walk did the same until they were stopped):
      # both APKs are built first, Gradle stops, and the emulator step's Gradle finds them up to date
      - name: Build the profile run's two APKs, then free the memory Gradle held
        working-directory: android
        run: |
          set -euo pipefail
          ./gradlew :app:packageNonMinifiedRelease :baselineprofile:packageNonMinifiedRelease -Pkotlin.compiler.execution.strategy=in-process --stacktrace
          ./gradlew --stop
          pkill -f '[K]otlinCompileDaemon' || true
          free -m
      # -gpu swangle_indirect (ANGLE on SwiftShader): with swiftshader_indirect the emulator died as the app drew (android-v10:
      # after a cold start, mid-walk, 95 s into the profile run) with memory to spare; a step timeout lets the failure log run
      - name: Baseline Profile on the emulator (debug-signed build)
        timeout-minutes: 30
        uses: ReactiveCircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
        with:
          api-level: 36
          target: ${{ steps.avd.outputs.target }}
          arch: x86_64
          profile: ${{ steps.avd.outputs.profile }}
          cores: 4
          ram-size: 4096M
          disk-size: 6000M
          emulator-options: -no-window -gpu swangle_indirect -no-snapshot -noaudio -no-boot-anim -camera-back none
          disable-animations: true
          working-directory: android
          script: ./gradlew :app:generateReleaseBaselineProfile -Pkotlin.compiler.execution.strategy=in-process --stacktrace
      - name: "When the profile run failed: the runner's memory and whether the kernel stopped the emulator"
        if: failure()
        run: |
          free -m
          k=$(sudo dmesg | grep -iE 'out of memory|oom-kill|killed process|segfault|general protection|qemu|emulator' | tail -n 10 || true)
          echo "${k:-Nothing about memory or the emulator in the kernel log.}"
          find /tmp/android-* "$HOME/.android" -maxdepth 3 -iname '*crash*' 2> /dev/null | head -n 5 || true
      - name: The Baseline Profile is there
        run: |
          set -euo pipefail
          D=android/app/src/release/generated/baselineProfiles
          if [ ! -s "$D/baseline-prof.txt" ]; then echo "::error::No Baseline Profile at $D/baseline-prof.txt after generateReleaseBaselineProfile."; exit 1; fi
          for f in "$D"/*.txt; do echo "$f: $(wc -l < "$f") rules"; done
      - name: "Sign: get the key, build the release"
        env:
          P12_B64: ${{ secrets.ANDROID_SIGNING_P12_B64 }}
          P12_PASS: ${{ secrets.ANDROID_SIGNING_PASSWORD }}
          CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          umask 077
          K="$RUNNER_TEMP/k.p12"; KD="$RUNNER_TEMP/kv"
          rm -rf "$KD" "$K"; mkdir -p "$KD"
          trap 'rm -rf "$KD" "$K"' EXIT
          if [ -n "$P12_B64" ] && [ -n "$P12_PASS" ]; then
            echo "Signing key: from the GitHub secrets"
            printf '%s' "$P12_PASS" | tr -d '\r\n' > "$KD/p.txt"
            printf '%s\n' "$P12_B64" | { grep -v -e '^-----' || true; } | tr -d '[:space:]' > "$KD/k.b64"
          else
            echo "Signing key: the GitHub secrets are empty, so it comes from the Cloudflare KV copy playnext-android-signing"
            if [ -z "$CF_TOKEN" ]; then
              echo "::error::No signing key: ANDROID_SIGNING_P12_B64 / ANDROID_SIGNING_PASSWORD are empty and there's no CLOUDFLARE_API_TOKEN to read the KV copy."
              exit 1
            fi
            (
              cd "$KD"   # no config file here, so wrangler uses only what's given
              W="npx --yes wrangler@4.152.0"
              export WRANGLER_SEND_METRICS=false
              CLOUDFLARE_API_TOKEN=$(printf '%s' "$CF_TOKEN" | tr -d '[:space:]'); export CLOUDFLARE_API_TOKEN
              A=$(printf '%s' "$CF_ACCOUNT" | tr -d '[:space:]')
              if [ -z "$A" ]; then
                if ! $W whoami > who.txt 2>&1; then tail -n 5 who.txt; echo "::error::Cloudflare didn't accept CLOUDFLARE_API_TOKEN."; exit 1; fi
                A=$(grep -Eo '[0-9a-f]{32}' who.txt | head -n 1 || true)
              fi
              if [ -z "$A" ]; then echo "::error::Couldn't tell which Cloudflare account to use. Add a CLOUDFLARE_ACCOUNT_ID secret."; exit 1; fi
              export CLOUDFLARE_ACCOUNT_ID="$A"
              if ! $W kv namespace list > ns.json 2> ns.err; then tail -n 5 ns.err; echo "::error::Couldn't list the KV namespaces."; exit 1; fi
              NS=$(node -e '
                const s = require("fs").readFileSync(process.argv[2], "utf8");
                const a = JSON.parse(s.slice(s.indexOf("[")));
                const hit = a.filter(x => x.title === process.argv[1]);
                process.stdout.write(hit.length === 1 ? String(hit[0].id) : "");
              ' playnext-android-signing "$KD/ns.json" || true)
              if ! [[ "$NS" =~ ^[0-9a-f]{32}$ ]]; then
                echo "::error::No KV namespace titled playnext-android-signing. Run the 'Android signing key: copy to Cloudflare' workflow once."
                exit 1
              fi
              if ! $W kv key get keystore --namespace-id "$NS" --remote > k.raw 2> get.err; then tail -n 5 get.err; echo "::error::Couldn't read the keystore from playnext-android-signing."; exit 1; fi
              if ! $W kv key get password --namespace-id "$NS" --remote > p.raw 2> get.err; then tail -n 5 get.err; echo "::error::Couldn't read the password from playnext-android-signing."; exit 1; fi
              tr -d '[:space:]' < k.raw > k.b64
              tr -d '\r\n' < p.raw > p.txt
              rm -f k.raw p.raw
            )
          fi
          PASS=$(cat "$KD/p.txt")
          if [ -z "$PASS" ]; then echo "::error::The signing password is empty."; exit 1; fi
          echo "::add-mask::$PASS"
          unset P12_B64 P12_PASS CF_TOKEN CF_ACCOUNT   # Gradle needs none of these
          if ! grep -Eq '^[A-Za-z0-9+/]+={0,2}$' "$KD/k.b64"; then echo "::error::The signing key isn't base64 text."; exit 1; fi
          base64 -d "$KD/k.b64" > "$K"
          export PN_SIGNING_STORE_FILE="$K" PN_SIGNING_STORE_PASSWORD="$PASS" PN_SIGNING_KEY_ALIAS=playnext PN_SIGNING_KEY_PASSWORD="$PASS"
          cd android
          # no Gradle or Kotlin daemon outlives this step holding the password in its environment
          ./gradlew :app:assembleRelease "-Ppn.versionCode=$CODE" --no-daemon -Pkotlin.compiler.execution.strategy=in-process --stacktrace
      - name: Forget the signing key
        if: always()
        run: |
          rm -rf "$RUNNER_TEMP/k.p12" "$RUNNER_TEMP/kv"
          pkill -f 'GradleDaemon|KotlinCompileDaemon' || true
      - name: The APK is signed with the release key (android/signing-cert.txt)
        run: |
          set -euo pipefail
          APK=android/app/build/outputs/apk/release/app-release.apk
          if [ ! -f "$APK" ]; then echo "::error::No APK at $APK"; exit 1; fi
          BT="$ANDROID_HOME/build-tools/37.0.0"
          if [ ! -x "$BT/apksigner" ]; then BT=$( (ls -d "$ANDROID_HOME"/build-tools/*/ 2>/dev/null || true) | sort -V | tail -n 1); BT="${BT%/}"; fi
          if [ -z "$BT" ] || [ ! -x "$BT/apksigner" ]; then echo "::error::No apksigner in $ANDROID_HOME/build-tools"; exit 1; fi
          "$BT/apksigner" verify --print-certs "$APK" > "$RUNNER_TEMP/certs.txt"
          # apksigner labels its lines "Signer #1 …" or, per signing scheme, "V2 Signer: …" / "V3 Signer: …" (build-tools 37
          # with no v1 signature: android-v1's first run failed on this). One scheme or several, every label must name the
          # same single certificate; the source stamp's own "Source Stamp Signer" lines aren't the app's key.
          LBL='^(Signer #[0-9]+|V[0-9.]+ Signer( #[0-9]+)?):? certificate'
          sed -En "s/$LBL SHA-256 digest: *//p" "$RUNNER_TEMP/certs.txt" | tr -d ': \t\r' | tr 'A-F' 'a-f' | sort -u > "$RUNNER_TEMP/digests.txt"
          signers=$(grep -c . "$RUNNER_TEMP/digests.txt" || true)
          if [ "$signers" != 1 ]; then cat "$RUNNER_TEMP/certs.txt"; echo "::error::The APK should have exactly one signing certificate, it has $signers."; exit 1; fi
          dn=$(sed -En "s/$LBL DN: *//p" "$RUNNER_TEMP/certs.txt" | sort -u)
          got=$(cat "$RUNNER_TEMP/digests.txt")
          case "$dn" in *"CN=Android Debug"*) echo "::error::The APK is signed with a debug key, not the release key."; exit 1 ;; esac
          if ! [[ "$got" =~ ^[0-9a-f]{64}$ ]]; then cat "$RUNNER_TEMP/certs.txt"; echo "::error::Couldn't read the APK's certificate SHA-256."; exit 1; fi
          want=""
          if [ -f android/signing-cert.txt ]; then want=$(tr -d ':[:space:]' < android/signing-cert.txt | tr 'A-F' 'a-f'); fi
          if [ -z "$want" ]; then
            echo "::warning::android/signing-cert.txt is empty, so the key wasn't checked. Record this certificate SHA-256 there: $got"
          elif ! [[ "$want" =~ ^[0-9a-f]{64}$ ]]; then
            echo "::error::android/signing-cert.txt should hold one SHA-256 (64 hex digits, colons allowed)."
            exit 1
          elif [ "$want" != "$got" ]; then
            echo "::error::The APK is signed with a different key ($got) than android/signing-cert.txt ($want). The phone would refuse this update."
            exit 1
          else
            echo "Signed with the release key: $got"
          fi
      - name: Release files and notes
        run: |
          set -euo pipefail
          OUT="$RUNNER_TEMP/release"; rm -rf "$OUT"; mkdir -p "$OUT"
          NAME="play-next-android-v$CODE.apk"
          cp android/app/build/outputs/apk/release/app-release.apk "$OUT/$NAME"
          MAP=android/app/build/outputs/mapping/release/mapping.txt
          if [ ! -s "$MAP" ]; then echo "::error::No R8 mapping at $MAP (is R8 on for release builds?)"; exit 1; fi
          cp "$MAP" "$OUT/mapping-android-v$CODE.txt"
          HEX=$(sha256sum < "$OUT/$NAME" | cut -d' ' -f1)
          printf '%s  %s\n' "$HEX" "$NAME" > "$OUT/$NAME.sha256"   # the sha256sum -c format
          SIZE=$(stat -c %s "$OUT/$NAME")
          printf '%s %s %s %s\n' "$CODE" "$HEX" "$SIZE" "android-v$CODE" > "$OUT/android-latest.txt"
          echo "$NAME: $SIZE bytes, sha256 $HEX"
          # the notes: the say= line of release N's block in whatsnew.txt (a block is lines between blank lines,
          # marked v=N or [N]); HTML tags dropped. Nothing for N: "Fixes".
          WN=android/app/src/main/assets/whatsnew.txt
          SAY=""
          if [ -f "$WN" ]; then
            SAY=$(tr -d '\r' < "$WN" | awk -v n="$N" '
              BEGIN { RS = ""; FS = "\n" }
              {
                hit = 0; say = ""
                for (i = 1; i <= NF; i++) {
                  l = $i; k = l; gsub(/[ \t]/, "", k)
                  if (k == "v=" n || k == "[" n "]" || k == "[v" n "]") hit = 1
                  if (say == "" && l ~ /^[ \t]*say[ \t]*=/) { say = l; sub(/^[ \t]*say[ \t]*=[ \t]*/, "", say) }
                }
                if (!done && hit && say != "") { print say; done = 1 }
              }' | sed 's/<[^>]*>//g' | cut -c1-1000)
          fi
          if [ -z "$SAY" ]; then SAY="Fixes"; fi
          printf '%s\n' "$SAY" > "$RUNNER_TEMP/notes.md"
          echo "Notes: $SAY"
      - name: Draft release (the phone can't see a draft)
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          TAG="android-v$CODE"; OUT="$RUNNER_TEMP/release"
          gh api --paginate "repos/$GH_REPO/releases?per_page=100" --jq '.[].tag_name' > "$RUNNER_TEMP/tags-now.txt"
          if grep -qx "$TAG" "$RUNNER_TEMP/tags-now.txt"; then
            echo "::error::A release tagged $TAG already exists (a draft from an earlier try?). Run this workflow by hand to release under the next number."
            exit 1
          fi
          gh release create "$TAG" --draft --target "$SHA" --title "Play next Android v$CODE" --notes-file "$RUNNER_TEMP/notes.md" \
            "$OUT/play-next-android-v$CODE.apk" "$OUT/play-next-android-v$CODE.apk.sha256" \
            "$OUT/android-latest.txt" "$OUT/mapping-android-v$CODE.txt"
          echo "Draft $TAG made with its 4 files"
      # The walk comes from this workflow's own commit, so a rollback (an older ref) is checked the same way; a ref from
      # before the made-up backup (Demo.kt, android-v10) can't open the screens on an emulator, so it gets the probe only.
      - name: The smoke test (tools/android-smoke.sh from this workflow's commit)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          path: .smoke
          sparse-checkout: tools/android-smoke.sh
          sparse-checkout-cone-mode: false
          persist-credentials: false
      - name: Walk the screens, or the probe only on a ref without the made-up backup
        run: |
          set -euo pipefail
          if [ -f android/app/src/main/java/io/github/shamlawy/playnext/data/Demo.kt ]; then w=walk; else w=probe; fi
          echo "SMOKE_WALK=$w" >> "$GITHUB_ENV"
          echo "Smoke test: $w"
      - name: "Smoke test: the signed APK on a fresh emulator walks every screen and the probe, alive after 20 s"
        timeout-minutes: 15
        uses: ReactiveCircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
        with:
          api-level: 36
          target: ${{ steps.avd.outputs.target }}
          arch: x86_64
          profile: ${{ steps.avd.outputs.profile }}
          cores: 4
          ram-size: 4096M
          disk-size: 6000M
          emulator-options: -no-window -gpu swangle_indirect -no-snapshot -noaudio -no-boot-anim -camera-back none
          disable-animations: true
          script: bash .smoke/tools/android-smoke.sh "$RUNNER_TEMP/release/play-next-android-v$CODE.apk" "$RUNNER_TEMP/smoke" "$SMOKE_WALK"
      - name: Keep the smoke test's logcat and screenshot
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: android-smoke-v${{ needs.version.outputs.code }}
          path: ${{ runner.temp }}/smoke/
          if-no-files-found: ignore
          retention-days: 14
      - name: Publish as latest (the phone sees it now)
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          TAG="android-v$CODE"
          gh release edit "$TAG" --draft=false --latest
          at=$(gh api "repos/$GH_REPO/git/ref/tags/$TAG" --jq '.object.sha' 2>/dev/null || true)
          if [ "$at" != "$SHA" ]; then echo "::warning::$TAG points at ${at:-nothing yet}, expected $SHA."; fi
          echo "$TAG is released"
          echo "**$TAG is released** (\`$SHA\`, release=$N): the phone updates itself." >> "$GITHUB_STEP_SUMMARY"
