# The friend uses an iPhone 11 and an iPad (Safari). This opens the app in Playwright's WebKit at those sizes, walks every
# screen, a game page, Settings, Edit and the chat, and prints script errors plus the problems the app reports about itself.
# Runs on every push to main that changes index.html, and by hand from the Actions tab. Screenshots: the "webkit" artifact.
name: WebKit check
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "index.html"
      - "sw.js"
      - ".github/scripts/webkitcheck.mjs"
      - ".github/scripts/swcheck.mjs"
      - ".github/workflows/webkit-check.yml"
permissions:
  contents: read
jobs:
  webkit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install WebKit
        run: npm i --no-save playwright@1.56.1 >/dev/null 2>&1 && npx playwright install --with-deps webkit >/dev/null 2>&1
      - name: Walk the app on iPhone 11 and iPad
        run: set -o pipefail; node .github/scripts/webkitcheck.mjs | tee webkit-report.txt
      - name: Pictures shrunk on the phone (sw.js, v268)
        if: always()
        run: node .github/scripts/swcheck.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: webkit
          path: |
            webkit/
            webkit-report.txt
          retention-days: 7
