# The friend uses an iPhone 11 and an iPad (Safari). This opens the app in Playwright's WebKit at those sizes, walks every
# screen, a game page, Settings, Edit and the chat, and prints script errors plus the problems the app reports about itself.
# Runs on every push to main that changes index.html, and by hand from the Actions tab. Screenshots: the "webkit" artifact.
name: WebKit check
on:
  workflow_dispatch:
    inputs:
      scenario:
        description: "Also run a saved scenario in WebKit (e.g. tools/scenarios/rail-nexi.mjs)"
        required: false
        default: ""
      widths:
        description: "Its widths (414 = iPhone 11, 810 / 1080 = iPad upright / sideways)"
        required: false
        default: "414,1080"
  push:
    branches: [main]
    paths:
      - "index.html"
      - "sw.js"
      - ".github/scripts/webkitcheck.mjs"
      - ".github/scripts/swcheck.mjs"
      - ".github/workflows/webkit-check.yml"
permissions:
  contents: read
jobs:
  webkit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install WebKit
        run: npm i --no-save playwright@1.56.1 >/dev/null 2>&1 && npx playwright install --with-deps webkit >/dev/null 2>&1
      - name: Walk the app on iPhone 11 and iPad
        run: set -o pipefail; node .github/scripts/webkitcheck.mjs | tee webkit-report.txt
      - name: Saved scenario in WebKit (tools/kit.mjs run --browser webkit)
        if: always() && inputs.scenario != ''
        env:
          SCENARIO: ${{ inputs.scenario }}
          WIDTHS: ${{ inputs.widths }}
        run: |
          case "$SCENARIO" in tools/scenarios/*.mjs) ;; *) echo "scenario must be tools/scenarios/<name>.mjs"; exit 1;; esac
          case "$WIDTHS" in *[!0-9,]*) echo "widths: numbers and commas only"; exit 1;; esac
          set -o pipefail; node tools/kit.mjs run "$SCENARIO" --browser webkit --widths "$WIDTHS" | tee -a webkit-report.txt
      - name: Pictures shrunk on the phone (sw.js, v268)
        if: always()
        run: node .github/scripts/swcheck.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: webkit
          path: |
            webkit/
            webkit-report.txt
          retention-days: 7
