# By hand (Actions tab), or when the probe or the helper changes: the skills book's game music (helper /ost, /ost/clip)
# through the helper's own code against Apple's real iTunes Search, and the live helper. This container can't reach either.
# Read it with the job log. Titles: well-known games only (a public repo's logs are public).
name: Music probe
on:
  workflow_dispatch:
    inputs:
      titles:
        description: "Game names, | separated (well-known games, not the owner's)"
        required: false
  push:
    paths:
      - ".github/scripts/ostprobe.mjs"
      - "worker/helper.js"
      - ".github/workflows/ost-probe.yml"
      - "tools/scenarios/skills-book-music-live.mjs"
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Probe
        env:
          TITLES: ${{ github.event.inputs.titles }}
        run: node .github/scripts/ostprobe.mjs 2>&1
      # v322: the whole chain on a phone-sized Chromium, Sounds off, against the live helper and Apple's clip
      - name: Install Chromium
        run: npm i --no-save playwright@1.56.1 >/dev/null 2>&1 && npx playwright install --with-deps chromium >/dev/null 2>&1
      - name: The book plays a real game's music (live helper)
        env:
          FAKE_HELPER: live
          # Playwright's own Chromium can't decode AAC (Apple's clips are .m4a); the owner's Chrome can, and so can the runner's
          CHROME: /usr/bin/google-chrome
        run: node tools/kit.mjs run tools/scenarios/skills-book-music-live.mjs --widths 412
