<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Play next</title>
<!-- installed-app bits. Harmless when opened as a local file: the manifest and
     worker simply fail to load and nothing else changes. -->
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#04060E">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="apple-touch-icon" href="logo-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:ital,wdth,wght@0,62..125,400..900;1,62..125,700..900&display=swap" rel="stylesheet">

<style>
  :root {
    --void: #04060E; --ink: #080F24; --steel: #101C40; --edge: #24407F;
    --volt: #4DA3FF; --ice: #EAF2FF; --mute: #7C92C4; --hot: #FF5470; --skew: -7deg;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  button, a, [role="button"], summary, input, select, textarea, label {
    -webkit-tap-highlight-color: transparent;
  }
  button:focus:not(:focus-visible), summary:focus:not(:focus-visible) { outline: none; }
  html {
    background: var(--void);
    background-image: repeating-linear-gradient(115deg, rgba(77,163,255,.05) 0 1px, transparent 1px 9px);
  }
  /* a painted backdrop for the whole app, same recipe as a game's hub page */
  html.paper::before {
    content: ""; position: fixed; inset: 0; z-index: -2; pointer-events: none;
    background:
      radial-gradient(116% 82% at 6% 116%, var(--w3, #2f6bff) 0%, rgba(0,0,0,0) 52%),
      radial-gradient(84% 60% at 104% 90%, var(--w2, #1c4fb8) 0%, rgba(0,0,0,0) 55%),
      radial-gradient(150% 120% at 64% 54%, var(--w2, #143a94) 0%, rgba(0,0,0,0) 62%),
      linear-gradient(180deg, var(--w0, #01030b) 0%, var(--w1, #061230) 54%, var(--w2, #0b2665) 100%);
    opacity: var(--wop, .85);
  }
  html, body { margin: 0; }
  body {
    color: var(--ice); font-family: "Archivo", system-ui, sans-serif;
    font-size: 15px; line-height: 1.45; -webkit-font-smoothing: antialiased;
    background: transparent;
  }
  html { scroll-behavior: smooth; }
  .wrap { max-width: 880px; margin: 0 auto; padding: 20px 16px 40px; overflow-x: hidden; position: relative; z-index: 1; }

  /* chamfered corners — opposite pair, matching the slant */
  nav button, .chip, .btn, .row, .hero .plate, .hit, .sheet-in, .stat, #toast {
    clip-path: polygon(var(--c, 11px) 0, 100% 0, 100% calc(100% - var(--c, 11px)),
      calc(100% - var(--c, 11px)) 100%, 0 100%, 0 var(--c, 11px));
  }
  .hero .plate, .sheet-in { --c: 22px; }
  .row { --c: 13px; content-visibility: auto; contain-intrinsic-size: auto 62px; }
  .chip, .btn, nav button { --c: 9px; }
  .stat { --c: 7px; }
  .slab { transform: skewX(var(--skew)); }
  .slab > * { transform: skewX(calc(var(--skew) * -1)); }

  header { margin: 0 0 16px 6px; display: flex; align-items: flex-start; gap: 12px; }
  header.tucked .slab { display: none; }
  header.tucked { margin-bottom: 6px; justify-content: flex-end; }
  #gear {
    background: var(--steel); color: var(--volt); border: 0; width: 46px; height: 46px;
    cursor: pointer; flex: none; --c: 11px; display: grid; place-items: center; padding: 0;
    clip-path: polygon(var(--c) 0, 100% 0, 100% calc(100% - var(--c)), calc(100% - var(--c)) 100%, 0 100%, 0 var(--c));
  }
  #gear svg { fill: currentColor; }
  @media (min-width: 760px) {
    html.rail nav #gear svg { width: 20px; height: 20px; }
  }
  html.round #gear { clip-path: none; border-radius: calc(var(--r, 18px) * .72); }
  #gear:hover { background: var(--volt); color: var(--void); }
  .setgroup { border-top: 1px solid var(--steel); margin-top: 22px; padding-top: 4px; }
  .setgroup h4 { margin: 14px 0 0; font-size: 13px; font-weight: 900; text-transform: uppercase;
    font-variation-settings: "wdth" 78; color: var(--ice); letter-spacing: .05em; }
  input[type=range] { accent-color: var(--volt); padding: 0; }
  .rowline { display: flex; align-items: center; gap: 10px; }
  .rowline span.v { color: var(--mute); font-size: 12px; min-width: 42px; text-align: right; font-variant-numeric: tabular-nums; }
  h1 {
    margin: 0; font-size: clamp(34px, 11vw, 58px); font-weight: 900;
    font-variation-settings: "wdth" 64; font-style: italic; letter-spacing: .02em;
    line-height: .88; text-transform: uppercase;
    text-shadow: 4px 4px 0 var(--edge), 8px 8px 0 rgba(4,6,14,.9);
  }
  .sub { color: var(--mute); font-size: 13px; margin: 6px 0 0; }

  nav svg { width: 15px; height: 15px; fill: currentColor; flex: none; display: none; }
  nav { display: flex; flex-wrap: wrap; gap: 6px; margin: 18px 0 24px; }

  /* a side rail once there's room — the Fold's inner screen has plenty */
  @media (min-width: 760px) {
    html.rail .wrap { padding-left: calc(var(--railw, 92px) + 16px); }
    html.rail nav {
      position: fixed; left: 0; top: 0; bottom: 0; width: var(--railw, 92px); z-index: 30;
      transition: transform .24s ease;
      margin: 0; flex-direction: column; flex-wrap: nowrap; gap: 10px;
      justify-content: flex-start; align-items: center;
      background: var(--ink); border-right: 1px solid var(--edge); padding: 18px 8px 18px;
      overflow-y: auto;
    }
    /* the accent marks the icon, not the whole strip */
    html.rail nav button {
      flex: none; width: 100%; transform: none; border-left: 0; background: none;
      display: grid; gap: 6px; justify-items: center; padding: 0;
      clip-path: none;
    }
    html.rail nav button span { transform: none; font-size: 9.5px; letter-spacing: .03em; }
    html.rail nav svg {
      display: block; width: 20px; height: 20px; padding: calc(var(--railw, 92px) * .12); box-sizing: content-box;
      background: var(--steel); color: var(--mute);
      clip-path: polygon(9px 0, 100% 0, 100% calc(100% - 9px), calc(100% - 9px) 100%, 0 100%, 0 9px);
    }
    html.rail nav button[aria-current="true"] { color: var(--ice); }
    html.rail nav button[aria-current="true"] svg { background: var(--volt); color: var(--void); }
  }
  nav button {
    flex: 1 1 auto; background: var(--steel); color: var(--mute); border: 0; border-left: 3px solid var(--edge);
    padding: 11px 10px; font: inherit; font-size: 12px; font-weight: 800; cursor: pointer;
    transform: skewX(var(--skew)); font-variation-settings: "wdth" 78;
  }
  nav button span, .chip span, .btn span { display: block; transform: skewX(calc(var(--skew) * -1)); }
  nav button[aria-current="true"] { background: var(--volt); color: var(--void); border-left-color: var(--ice); }
  :focus-visible { outline: 3px solid var(--volt); outline-offset: 3px; }

  .panel { display: none; }
  .panel.on { display: block; }
  @media (prefers-reduced-motion: no-preference) {
    html.tabfade .panel.on { animation: cut .28s cubic-bezier(.16,1,.3,1) both; }
    @keyframes cut { from { opacity: 0; transform: translateY(14px) scale(.99); } }
  }

  .hero { position: relative; z-index: 0; margin-bottom: 26px; }
  .hero .plate {
    background: linear-gradient(100deg, var(--steel) 0%, var(--ink) 70%);
    border-left: 5px solid var(--accent, var(--volt)); padding: 18px 20px;
    filter: drop-shadow(0 20px 26px rgba(0,0,0,.75));
  }
  .hero::before {
    content: ""; position: absolute; inset: 10px 34% 10px -8px; z-index: -1;
    background: var(--accent, var(--volt)); filter: blur(30px); opacity: .3; pointer-events: none;
  }
  .hero .plate { position: relative; overflow: hidden; }
  .plate-in { position: relative; z-index: 1; display: flex; gap: 18px; align-items: flex-start; width: 100%; flex-wrap: wrap; min-width: 0; }
  .cardbg {
    position: absolute; inset: 0; z-index: 0; pointer-events: none;
    background-image: var(--bgimg); background-size: cover; background-position: right center;
    opacity: var(--cbh, .16); filter: saturate(.8);
    -webkit-mask-image: linear-gradient(90deg, transparent 12%, #000 78%);
    mask-image: linear-gradient(90deg, transparent 12%, #000 78%);
  }
  .ghostword {
    position: absolute; z-index: 0; right: -1.5%; top: -4%; pointer-events: none;
    font-size: clamp(52px, 14vw, 132px); font-weight: 900; font-style: italic;
    font-variation-settings: "wdth" 68; text-transform: uppercase; line-height: .82;
    white-space: nowrap; color: transparent; opacity: var(--cbg, .13);
    -webkit-text-stroke: 2px var(--accent, var(--volt));
  }
  .plate-in > * { min-width: 0; }
  .toprow { display: flex; gap: 8px; align-items: center; margin-bottom: 6px; }
  .toprow .kicker { margin: 0; }

  .stats { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 14px; }
  .stat { background: rgba(255,255,255,.055); border-bottom: 2px solid var(--accent, var(--volt)); padding: 9px 13px 8px; min-width: 88px; }
  .stat b {
    display: block; font-size: clamp(28px, 3.4vw, 40px); font-weight: 900; font-style: italic;
    font-variation-settings: "wdth" 66; line-height: 1;
  }
  .stat b i { font-size: .42em; color: var(--mute); }
  /* the counting number must not inherit the label styling below it */
  .stat b [data-count] {
    font: inherit; font-size: inherit; color: inherit; letter-spacing: inherit;
    font-variation-settings: inherit; text-transform: none;
  }
  .stat > span { display: block; font-size: 11px; color: var(--mute); font-weight: 800; letter-spacing: .05em; margin-top: 3px; }
  .pips { display: flex; gap: 2px; margin-top: 7px; }
  .pips i { width: 7px; height: 11px; background: var(--edge); transform: skewX(-10deg); }
  .pips i.on { background: var(--accent, var(--volt)); }
  @media (prefers-reduced-motion: no-preference) {
    .pips i.on { animation: pipin .34s cubic-bezier(.16,1,.3,1) both; animation-duration: var(--pdur, .34s); }
    @keyframes pipin { from { opacity: 0; transform: skewX(-10deg) scaleY(.15); } }
  }
  .evenings { color: var(--mute); font-size: 12px; margin: 10px 0 0; }
  .tag.st-upcoming { background: var(--edge); color: var(--ice); }
  .tag.st-backlog { background: #E8A33C; color: var(--void); }
  .tag.st-playing { background: #3FD9A4; color: var(--void); }
  .plats { display: flex; gap: 5px; flex-wrap: wrap; margin-top: 12px; }
  .plats.pos-tr, .plats.pos-br, .plats.pos-tl {
    position: absolute; z-index: 3; margin: 0; max-width: 42%; justify-content: flex-end;
  }
  .plats.pos-tr { top: 14px; right: 16px; }
  .plats.pos-tl { top: 14px; left: 16px; justify-content: flex-start; }
  .plats.pos-br { bottom: 14px; right: 16px; }
  .plat { display: inline-flex; align-items: center; gap: 5px;
    font-size: 10px; font-weight: 800; letter-spacing: .04em; text-transform: uppercase;
    border: 1px solid var(--edge); color: var(--ice); padding: 3px 7px; background: rgba(4,6,14,.5); }
  .plat svg { width: 13px; height: 13px; flex: none; display: block; }
  .steamgrid { display: flex; flex-wrap: wrap; gap: 9px; margin-top: 8px; }
  .steamtile { width: 148px; display: grid; gap: 4px; }
  .steamtile img { width: 100%; background: var(--ink); display: block; }
  .steamtile small { font-size: 10px; color: var(--mute); font-weight: 800; }
  .platpick { display: flex; flex-wrap: wrap; gap: 5px; }
  .genrepick { gap: 5px 5px; }
  .pickhead {
    flex: 1 0 100%; font-size: 9.5px; font-weight: 900; letter-spacing: .1em; text-transform: uppercase;
    color: var(--mute); margin: 9px 0 1px; opacity: .75;
  }
  .genrepick .pickhead:first-child { margin-top: 2px; }
  /* collapsible groups, so a long sheet is a short list until you open something */
  .setgroup.wrapped { border: 0; margin: 0; padding: 0; }
  details.grp { border-top: 1px solid var(--edge); }
  details.grp > summary > b { flex: none; }
  details.grp > summary > em {
    margin-left: auto; font-style: normal; font-weight: 700; font-size: 11px;
    letter-spacing: 0; text-transform: none; color: var(--mute);
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap; min-width: 0;
  }
  details.grp[open] > summary > em { opacity: .45; }
  details.grp > summary {
    cursor: pointer; list-style: none; padding: 11px 2px 9px;
    font-size: 12px; font-weight: 900; font-style: italic; font-variation-settings: "wdth" 74;
    text-transform: uppercase; letter-spacing: .06em; color: var(--ice);
    display: flex; align-items: center; gap: 8px;
  }
  details.grp > summary { flex-wrap: wrap; }
  details.grp > summary > .gdesc {
    flex-basis: 100%; order: 3; margin-top: 3px; font-size: 11.5px; font-style: normal;
    font-weight: 700; letter-spacing: 0; text-transform: none; color: var(--mute);
    font-variation-settings: "wdth" 100;
  }
  details.grp[open] > summary > .gdesc { color: var(--mute); }
  details.grp > summary::-webkit-details-marker { display: none; }
  details.grp > summary::after {
    content: "+"; padding-left: 12px; font-style: normal; font-size: 15px; color: var(--volt);
  }
  details.grp[open] > summary::after { content: "−"; }
  details.grp[open] > summary { color: var(--volt); }
  details.grp > :last-child { padding-bottom: 8px; }
  .platpick .chip { display: inline-flex; align-items: center; gap: 6px; }
  .platpick .chip[aria-pressed="true"] { color: var(--ice); border-bottom-color: var(--volt); }
  .platpick svg { width: 15px; height: 15px; flex: none; }
  .sortsel { width: auto; flex: 0 1 auto; min-width: 118px; max-width: 190px; padding: 8px 10px;
    font-weight: 800; border-bottom-width: 2px; }
  /* the sort menu, built rather than native, so it looks like the rest of the app */
  #sortrow { margin: 6px 0 18px; }
  .sortmenu { position: relative; display: inline-flex; }
  .sortpop {
    position: absolute; top: calc(100% + 7px); left: 0; z-index: 50; min-width: 200px;
    background: var(--ink); border: 1px solid var(--edge); padding: 5px; display: grid; gap: 2px;
    max-height: 58vh; overflow-y: auto; box-shadow: 0 18px 44px rgba(0,0,0,.62);
  }
  /* display:grid above would beat the browser's own hidden rule, so say it here */
  .sortpop[hidden] { display: none; }
  html.round .sortpop { border-radius: calc(var(--r, 18px) * .6); }
  .sortpop button {
    text-align: left; background: none; border: 0; color: var(--mute); font: inherit;
    font-size: 13px; font-weight: 800; padding: 10px 12px; cursor: pointer;
    font-variation-settings: "wdth" 84;
  }
  .sortpop button:hover, .sortpop button:focus-visible { background: rgba(234,242,255,.08); color: var(--ice); }
  .sortpop button[aria-pressed="true"] { background: var(--volt); color: var(--void); }
  .sortpop .act { border-top: 1px solid var(--edge); margin-top: 4px; color: var(--volt); }
  .when.bad { color: #e8443a; text-decoration: line-through 1px; }
  .when { font-size: 10.5px; font-weight: 900; color: var(--volt); flex: none;
    font-variant-numeric: tabular-nums; letter-spacing: .02em; }
  .again { border-bottom-color: var(--volt) !important; color: var(--ice) !important; }
  .libgrid { display: grid; grid-template-columns: repeat(var(--libcols, 3), minmax(0, 1fr)); gap: 10px; }
  /* swipe sideways, one cover at a time, neighbours peeking */
  .libreel {
    display: flex; gap: 12px; overflow-x: auto; scroll-snap-type: x mandatory;
    padding: 6px calc((100% - var(--reelw, 72%)) / 2) 14px;
    scrollbar-width: none; -webkit-overflow-scrolling: touch;
  }
  .libreel::-webkit-scrollbar { display: none; }
  .libreel .libcard {
    flex: 0 0 var(--reelw, 72%); scroll-snap-align: center;
    /* --near is 1 at the centre, 0 at the edges — set on scroll */
    transform: scale(calc(.82 + .18 * var(--near, 1)));
    opacity: calc(.42 + .58 * var(--near, 1));
    transform-origin: center bottom; will-change: transform, opacity;
  }
  .libreel .libshot { box-shadow: 0 calc(14px * var(--near, 1)) calc(30px * var(--near, 1)) rgba(0,0,0,.55); }
  .libreel .libtag { font-size: 11px; padding: 4px 7px; }
  .libreel .cn { font-size: 13px; padding-top: 8px; white-space: normal; }

  /* the whole-screen view: poster first, everything else below it */
  #full { position: fixed; inset: 0; z-index: 70; display: none; overflow-y: auto; background: var(--void); }
  #full.on { display: block; }
  /* the hub page — exactly one screen, nothing scrolls */
  #full { overflow: hidden; }
  .hub {
    position: relative; overflow: hidden; isolation: isolate;
    height: 100vh; height: 100dvh; width: 100%;
  }
  /* a painted wallpaper, so a game with no art still gets a real backdrop */
  .hub-paper {
    position: absolute; inset: 0; z-index: 0;
    background:
      radial-gradient(118% 84% at 8% 118%, var(--p3, #3f7bff) 0%, rgba(0,0,0,0) 54%),
      radial-gradient(84% 62% at 106% 92%, var(--p2, #2f6bff) 0%, rgba(0,0,0,0) 56%),
      radial-gradient(150% 120% at 66% 56%, var(--p2, #143a94) 0%, rgba(0,0,0,0) 64%),
      linear-gradient(180deg, var(--p0, #01030b) 0%, var(--p1, #05102c) 54%, var(--p2, #0a2263) 100%);
  }
  .hub-back {
    position: absolute; inset: 0; z-index: 1; background-size: cover; background-position: center;
    opacity: .42; filter: saturate(1.1);
    -webkit-mask-image: radial-gradient(120% 100% at 70% 40%, #000 30%, transparent 78%);
    mask-image: radial-gradient(120% 100% at 70% 40%, #000 30%, transparent 78%);
  }
  .hub-foot::before {
    content: ""; position: absolute; inset: -34px 0 0; z-index: -1; pointer-events: none;
    background: linear-gradient(to top, rgba(2,4,12,.9) 34%, rgba(2,4,12,.55) 68%, transparent);
  }
  .hub-lead::before {
    content: ""; position: absolute; inset: -18px -10px -14px -20px; z-index: -1; pointer-events: none;
    background: radial-gradient(120% 100% at 0% 40%, rgba(2,4,12,.82) 0%, rgba(2,4,12,.45) 52%, transparent 76%);
  }
  .hub-wedge {
    position: absolute; z-index: 2; left: -16%; bottom: -14%; width: 72%; height: 56%;
    background: var(--accent, var(--volt)); opacity: .14;
    clip-path: polygon(0 26%, 100% 0, 78% 100%, 0 100%);
  }
  .hub-strip {
    position: absolute; z-index: 3; right: 5px; top: 0; bottom: 0; width: 24px;
    display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 9px;
    writing-mode: vertical-rl; font-size: 10.5px; font-weight: 900; letter-spacing: .3em;
    color: var(--ice); opacity: .35; overflow: hidden; white-space: nowrap;
  }
  .hub-strip i { display: block; width: 3px; height: 3px; background: currentColor; }

  /* stepping between games slides the whole page, figure included, in the
     direction of the swipe. Only named while a step is running, so the
     cover-to-figure morph on opening is untouched. */
  .updated {
    position: fixed; left: 12px; right: 12px; z-index: 300;
    bottom: calc(env(safe-area-inset-bottom, 0px) + 18px);
    background: linear-gradient(160deg, var(--steel), var(--ink));
    border: 1px solid var(--volt); border-radius: 14px; padding: 13px 15px;
    display: flex; align-items: center; gap: 10px; flex-wrap: wrap;
    transform: translateY(18px); opacity: 0; transition: transform .28s ease, opacity .28s ease;
    box-shadow: 0 18px 40px rgba(0,0,0,.6);
  }
  .updated.show { transform: none; opacity: 1; }
  .updated b { color: var(--ice); font-size: 14px; letter-spacing: .04em; }
  .updated span { color: var(--mute); font-size: 12px; flex: 1 1 auto; }
  .updated button {
    background: var(--volt); color: #04060E; border: 0; border-radius: 9px;
    padding: 7px 13px; font: inherit; font-weight: 800; font-size: 12px; cursor: pointer;
  }

  /* ---- home ---- */
  .dash {
    display: grid; gap: 8px; grid-auto-flow: row dense;
    grid-template-columns: repeat(2, minmax(0, 1fr));
    max-width: 1100px; margin: 0 auto;
  }
  .dash .wide { grid-column: 1 / -1; }
  .tile {
    position: relative; overflow: hidden; border-radius: 13px; padding: 11px 12px;
    background: linear-gradient(160deg, var(--steel) 0%, var(--ink) 82%);
    border: 1px solid var(--edge);
    display: flex; flex-direction: column; gap: 5px;
  }
  .tile h5 {
    margin: 0 0 1px; font-size: 9.5px; letter-spacing: .14em; text-transform: uppercase;
    color: var(--mute); font-weight: 800;
  }
  .tile .big { font-size: 26px; line-height: 1; font-weight: 900; color: var(--ice); letter-spacing: -.01em; }
  .tile .big.word { font-size: 19px; }
  .tile .big em { font-style: normal; font-size: 12px; color: var(--mute); font-weight: 700; letter-spacing: 0; }
  .tile .sub { font-size: 11px; line-height: 1.3; color: var(--mute); margin: 0; }
  .tile.accent { border-color: var(--volt); }

  /* the recommendation, loudest thing on screen, text kept off the busy art */
  .pick { padding: 0; min-height: 130px; }
  .pick .shot {
    position: absolute; inset: 0; background-size: cover; background-position: center top;
    opacity: .5;
  }
  .pick .scrim {
    position: absolute; inset: 0;
    background: linear-gradient(100deg, var(--ink) 4%, rgba(8,15,36,.86) 40%, rgba(8,15,36,.15) 82%);
  }
  .pick .in {
    position: relative; z-index: 1; padding: 13px 14px; display: flex; flex-direction: column;
    gap: 4px; height: 100%; align-items: flex-start; text-align: left; max-width: 74%;
  }
  .pick .name { font-size: 22px; font-weight: 900; color: var(--ice); line-height: 1.05; }
  .pick .why { font-size: 11px; color: var(--mute); line-height: 1.3; margin-top: 2px; }
  .pick .go {
    margin-top: auto; padding-top: 8px; font-size: 10.5px; font-weight: 800;

  /* bare month arrows — a boxed button either side read as a frame around the grid */

  /* Home's own masthead — the old permanent banner lives here now */
  .homehead { margin: 0 0 14px; }

  .hh-top h1 { flex: 1 1 auto; min-width: 0; }
  .hh-top .chip { flex: none; margin-top: 6px; }
  .homehead h1 {
    margin: 0; font-size: 40px; line-height: .92; font-weight: 900; font-style: italic;
    font-variation-settings: "wdth" 70; text-transform: uppercase; color: var(--ice);
    letter-spacing: -.01em;
  }
  .homehead .sub { margin: 6px 0 0; color: var(--mute); font-size: 12.5px; }
  @media (min-width: 620px) { .homehead h1 { font-size: 54px; } }

  .covrow { display: flex; gap: 12px; align-items: flex-start; margin-top: 6px; }
  .cutprev {
    margin-top: 8px; padding: 10px; background:
      repeating-conic-gradient(var(--steel) 0% 25%, var(--ink) 0% 50%) 0 0 / 14px 14px;
    border: 1px solid var(--edge); display: grid; place-items: center; min-height: 92px;
  }
  .cutprev img { max-width: 100%; max-height: 128px; object-fit: contain; display: block; }

  .covrow img {
    width: 92px; flex: none; aspect-ratio: 3/4; object-fit: cover;
    background: var(--steel); border: 1px solid var(--edge);
  }
  .covside { flex: 1 1 auto; min-width: 0; }
  .covside .btn { margin-top: 8px; }

  .yearcard {
    background: linear-gradient(160deg, var(--steel), var(--ink) 80%);
    border: 1px solid var(--edge); border-radius: 14px; padding: 14px; margin-bottom: 18px;
  }
  .yearcard > .tabbar { margin-bottom: 12px; }
  .yearcard > .tabbar h3 { font-size: 30px; }
  .yearcard .chips { margin-left: auto; }
  .yearlist { display: grid; gap: 4px; margin-top: 12px; }
  .yr {
    display: flex; align-items: center; gap: 10px; width: 100%; text-align: left;

    color: inherit; font: inherit; font-size: 12.5px; cursor: pointer;
  }
  .yr .k { color: var(--mute); font-size: 10px; letter-spacing: .1em; text-transform: uppercase; width: 92px; flex: none; }
  .yr .t { flex: 1 1 auto; min-width: 0; color: var(--ice); font-weight: 700;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .yr .n { color: var(--volt); font-weight: 900; font-variant-numeric: tabular-nums; }
  .yr .n.bad { color: var(--hot); }

  .gate {
    background: var(--ink); border-left: 3px solid var(--volt); padding: 14px; margin-top: 6px;
  }
  .gatebar { height: 6px; border-radius: 3px; background: var(--edge); overflow: hidden; }
  .gatebar i { display: block; height: 100%; background: var(--volt); transition: width .3s ease; }
  .gatetop { margin: 9px 0 4px; color: var(--ice); font-weight: 800; font-size: 13px; }

  .whyhead {
    margin: 12px 0 5px; font-size: 10px; letter-spacing: .13em; text-transform: uppercase;
    color: var(--mute); font-weight: 800;
  }
  #e-why .chips { gap: 4px; }
  #e-why .chip { padding: 6px 10px; font-size: 11.5px; }

  .tonight-h { margin-top: 6px; }
  .tonight-h .chip { padding: 5px 10px; font-size: 11px; }
  .tile .chip.go {
    align-self: flex-start; margin-top: 8px; background: var(--volt); color: var(--void);
    border-bottom-color: var(--ice); font-size: 11.5px;
  }

  /* a tile you can press */
  .tile.go2 { cursor: pointer; text-align: left; font: inherit; }
  .tile.go2:active { border-color: var(--volt); }
  /* tinted by the game it is about, so Home reflects the library */
  .tile.tinted {
    background:
      linear-gradient(160deg, color-mix(in srgb, var(--tint) 26%, var(--steel)) 0%, var(--ink) 84%);
    border-color: color-mix(in srgb, var(--tint) 45%, var(--edge));
  }
  .tile.tinted::after { color: var(--tint); }
  .tile.go2::after {
    content: "→"; position: absolute; right: 11px; top: 9px;
    color: var(--volt); font-size: 13px; font-weight: 800;
  }
  .tile.go2.warn { border-color: var(--hot); }
  .tile.go2.warn::after { color: var(--hot); }

  /* the two extremes, side by side so the spread is the point */
  .swing { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .swing .s {
    display: flex; flex-direction: column; gap: 1px; min-width: 0;
    background: none; border: 0; padding: 0; color: inherit; font: inherit;
    cursor: pointer; text-align: left;
  }
  .swing .s:active { opacity: .7; }
  .swing .s b { font-size: 21px; font-weight: 900; line-height: 1; }
  .swing .s.up b { color: var(--volt); }
  .swing .s.dn b { color: var(--hot); }
  .swing .s span {
    color: var(--ice); font-size: 11.5px; font-weight: 700;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  .swing .s small { color: var(--mute); font-size: 10px; }

  /* the standings — the densest honest thing the app has */
  .stand { display: flex; flex-direction: column; gap: 5px; margin-top: 1px; }
  .stand .r {
    display: flex; align-items: center; gap: 8px; font-size: 12px; width: 100%;
    background: none; border: 0; border-left: 3px solid var(--tint, var(--edge));
    padding: 3px 0 3px 7px; margin-left: -7px; color: inherit; font: inherit;
    font-size: 12px; cursor: pointer; text-align: left;
  }
  .stand .r:active { background: var(--steel); }
  .stand .n { width: 15px; color: var(--mute); font-weight: 800; font-size: 10px; flex: none; }
  .stand .t {
    flex: 1 1 auto; color: var(--ice); font-weight: 700; white-space: nowrap;
    overflow: hidden; text-overflow: ellipsis;
  }
  .stand .bar { width: 46px; height: 4px; border-radius: 2px; background: var(--edge); flex: none; overflow: hidden; }
  .stand .bar i { display: block; height: 100%; background: var(--volt); }

  /* twelve columns, so the months sit under their own bars */
  .yearbar {
    display: grid; grid-template-columns: repeat(12, 1fr); gap: 3px;
    align-items: end; height: 46px; padding-bottom: 1px;
    border-bottom: 1px solid var(--edge);
  }
  .yearbar button {
    background: var(--edge); border: 0; border-radius: 3px 3px 0 0; min-height: 3px;
    display: block; width: 100%; padding: 0; cursor: pointer;
    transition: background .15s ease;
  }
  .yearbar button.hot { background: var(--volt); }
  .yearbar button:active { background: var(--ice); }
  .yearlab {
    display: grid; grid-template-columns: repeat(12, 1fr); gap: 3px;
    font-size: 8.5px; color: var(--mute); margin-top: 5px; text-align: center;
  }
  .yearlab span { overflow: hidden; }

  .meter { height: 4px; border-radius: 3px; background: var(--edge); overflow: hidden; }
  .meter i { display: block; height: 100%; background: var(--volt); border-radius: 3px; }

  @media (min-width: 620px) {
    .dash { grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 10px; }
    .dash .wide { grid-column: span 2; }
    .dash .full { grid-column: 1 / -1; }
    .pick { min-height: 172px; }
    .pick .name { font-size: 27px; }
  }

  /* the rail folds away and comes back, from the handle or a swipe */
  html.railoff .wrap { padding-left: 26px; }
  html.railoff nav { transform: translateX(-102%); }
  #railpop { display: none; }
  html.rail #railpop {
    display: grid; place-items: center; position: fixed; z-index: 31;
    top: 50%; left: var(--railw, 92px); transform: translateY(-50%);
    width: 16px; height: 48px; padding: 0; cursor: pointer;
    border-radius: 0 8px 8px 0; background: var(--ink); color: var(--mute);
    border: 1px solid var(--edge); border-left: 0; opacity: .55;
    transition: left .24s ease, opacity .2s ease;
  }
  html.rail #railpop:hover, html.rail #railpop:active { opacity: 1; }
  html.rail.railoff #railpop { left: 0; }
  #railpop svg { width: 11px; height: 11px; fill: currentColor; transition: transform .24s ease; }
  html.rail.railoff #railpop svg { transform: rotate(180deg); }
  /* the swipe target: a strip of the left edge, only while the rail is away */
  #railedge { display: none; }
  html.rail.railoff #railedge {
    display: block; position: fixed; left: 0; top: 0; bottom: 0; width: 22px; z-index: 29;
  }

  /* while a step runs, both pages are stacked and moved together */
  #full.sliding { overflow: hidden; }
  #full.sliding .hub { position: absolute; inset: 0; backface-visibility: hidden; }
  #full.sliding .hub.go {
    transition: transform .3s cubic-bezier(.32,.72,0,1);
    will-change: transform;
  }
  html.still #full.sliding .hub.go { transition: none; }
  .hub-fig {
    position: absolute; z-index: 3; right: var(--kx, 0%); top: 50%;
    transform: translateY(calc(-50% - var(--ky, 0%)));
    width: var(--kw, 62%); object-fit: contain; object-position: right center;
    max-height: min(calc(var(--kw, 62%) * 1.355), 124%);
    filter:
      drop-shadow(0 var(--kshy, 18px) var(--kshb, 34px) rgba(0, 0, 0, var(--ksho, .72)))
      drop-shadow(0 0 var(--kglb, 0px) color-mix(in srgb, var(--accent, #4DA3FF) var(--kglo, 0%), transparent));
  }
  html.still .hub-fig { transition: none; }
  .hub-fig.cover { max-height: min(calc(var(--kw, 54%) * 1.148), 104%); }
  .hub .fullx { position: absolute; z-index: 6; top: 12px; right: 12px; background: rgba(4,6,14,.6); }
  .hub-lead {
    position: absolute; z-index: 5; left: 0; right: 30%; top: 16px; padding: 0 16px;
    isolation: isolate;
  }
  /* behind the figure, in front of the wallpaper */
  .hub-ghost {
    position: absolute; left: 8px; top: 50%; transform: translateY(-50%); z-index: 2;
    pointer-events: none;
    font-size: clamp(52px, 18vw, 140px); line-height: .78; font-weight: 900; font-style: italic;
    font-variation-settings: "wdth" 60; text-transform: uppercase; white-space: nowrap;
    color: transparent; -webkit-text-stroke: 1.5px var(--ice); opacity: .14;
  }
  .hub-kick {
    display: inline-block; font-size: 9.5px; font-weight: 900; letter-spacing: .14em;
    text-transform: uppercase; color: var(--void); background: var(--accent, var(--volt));
    padding: 3px 9px; margin-bottom: 9px;
  }
  .hub h2 {
    margin: 0; font-size: clamp(26px, 9.5vw, 58px); line-height: .92; font-weight: 900; font-style: italic;
    font-variation-settings: "wdth" 64; text-transform: uppercase; overflow-wrap: anywhere;
    border-left: 5px solid var(--accent, var(--volt)); padding-left: 11px;
  }
  .hub-desc {
    margin: 10px 0 0; font-size: 12.5px; color: var(--ice); opacity: .75; max-width: 32ch;
    display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden;
  }
  .hub-chips { display: flex; flex-wrap: wrap; gap: 5px; margin-top: 11px; }
  .hub-chips span {
    font-size: 9px; font-weight: 900; letter-spacing: .1em; text-transform: uppercase;
    color: var(--ice); border: 1px solid rgba(234,242,255,.35); padding: 3px 7px;
  }
  .hub .plats { margin-top: 9px; }
  .hub-foot {
    position: absolute; z-index: 5; left: 0; right: 0; bottom: 0; padding: 12px 16px 16px;
    display: flex; align-items: flex-end; gap: 12px; flex-wrap: wrap;
  }
  .hub-data { display: flex; gap: 16px; flex: 1 1 auto; min-width: 0; }
  .hub-data > div { min-width: 0; }
  .hub-data b {
    display: block; font-size: clamp(17px, 5.4vw, 26px); line-height: 1; font-weight: 900;
    font-style: italic; font-variation-settings: "wdth" 66; color: var(--ice);
  }
  .hub-data span {
    display: block; margin-top: 4px; font-size: 8.5px; font-weight: 800;
    letter-spacing: .06em; text-transform: uppercase; color: var(--mute);
  }
  .hub-acts { display: flex; gap: 6px; flex: none; }
  /* outside .hub, so the slide never carries it and it is never rebuilt */
  .hub-dots {
    position: fixed; z-index: 90; left: 0; right: 0;
    bottom: calc(env(safe-area-inset-bottom, 0px) + 10px);
    display: flex; justify-content: center; gap: 5px; pointer-events: none;
    opacity: 0; transition: opacity .2s ease;
  }
  #full.on ~ .hub-dots, .hub-dots.show { opacity: 1; }
  .hub-dots i { width: 4px; height: 4px; background: var(--ice); opacity: .22; }
  .hub-dots i.on { opacity: .9; background: var(--accent, var(--volt)); width: 12px; }
  .hub.plain .hub-wedge, .hub.plain .hub-strip, .hub.plain .hub-ghost { display: none; }
  .hub.nopaper .hub-back { opacity: .55; }
  @media (min-width: 760px) {
    .hub-lead { right: 46%; bottom: 116px; padding: 0 28px; }
    .hub-fig { width: var(--kw, 54%); }
    .hub-foot { padding: 14px 28px 20px; }
  }
  .fullbody { max-width: 620px; margin: 0 auto; padding: 4px 16px 48px; }
  .fullx { position: fixed; top: 12px; right: 12px; z-index: 4; background: rgba(4,6,14,.72); }
  @media (prefers-reduced-motion: no-preference) {
    #full.on .fullshot img { animation: fadein .35s ease both; }
    #full .hub.noanim .fullshot img, #full .hub.noanim .fullbody { animation: none; }
    #full.on .fullbody { animation: peekin .34s cubic-bezier(.16,1,.3,1) both; }
  }
  .libcard { display: block; width: 100%; padding: 0; border: 0; background: none; cursor: pointer;
    text-align: left; color: inherit; font: inherit; }
  .libshot { position: relative; overflow: hidden; border-bottom: 3px solid var(--accent, var(--volt)); }
  .libshot img { width: 100%; aspect-ratio: 3/4; object-fit: cover; display: block; }
  .libcard .cn { display: block; font-size: 11px; font-weight: 800; color: var(--ice);
    padding: 6px 2px 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .libtag {
    position: absolute; z-index: 2; display: flex; align-items: center; gap: 4px;
    font-size: 9.5px; font-weight: 900; letter-spacing: .02em; padding: 3px 5px;
    background: rgba(3,5,12,.8); color: var(--ice); max-width: calc(100% - 10px);
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  }
  .libtag svg { width: 11px; height: 11px; flex: none; }
  .libtag.tl { left: 5px; top: 5px; }
  .libtag.tr { right: 5px; top: 5px; }
  .libtag.bl { left: 5px; bottom: 5px; }
  .libtag.br { right: 5px; bottom: 5px; }
  /* how the browser should animate between the two snapshots */
  ::view-transition-group(root) { animation-duration: .3s; }
  ::view-transition-old(root) {
    animation: vtout .2s cubic-bezier(.4,0,1,1) both;
  }
  /* the cover that travels gets a steady ease both ways */
  ::view-transition-group(.cv) { animation-duration: .3s; }
  ::view-transition-new(root) {
    animation: vtin .3s cubic-bezier(.16,1,.3,1) both;
  }
  @keyframes vtout { to { opacity: 0; transform: scale(.985); } }
  @keyframes vtin { from { opacity: 0; transform: scale(1.012); } }
  /* a cover keeps its identity, so it travels instead of blinking out */
  ::view-transition-group(*) {
    animation-duration: .3s; animation-timing-function: cubic-bezier(.32,.72,0,1);
  }
  html.still ::view-transition-group(*),
  html.still ::view-transition-old(root),
  html.still ::view-transition-new(root) { animation: none; }

  /* things should answer the moment you touch them */
  .row, .chip, .btn, .libcard, nav button, .duelpick, .icon { transition: transform .12s cubic-bezier(.2,.9,.25,1); }
  .row:active, .libcard:active, .duelpick:active { transform: skewX(var(--skew, 0deg)) scale(.985); }
  .chip:active, .btn:active, nav button:active, .icon:active { transform: translateY(1px); }
  html.still .row, html.still .chip, html.still .btn,
  html.still .libcard, html.still nav button, html.still .icon { transition: none; }

  /* the board: dotted canvas, art only, nothing boxed in */
  .flow {
    position: relative; margin-top: 6px; padding: 10px 0 16px;
    background-image: radial-gradient(var(--edge) 1px, transparent 1px);
    background-size: 17px 17px; background-position: -1px -1px;
  }
  .fjoin { position: relative; height: 58px; }
  .fjoin svg { width: 100%; height: 100%; display: block; }
  .fhop {
    position: absolute; top: 50%; transform: translate(-50%, -50%);
    font-size: 9.5px; font-weight: 900; letter-spacing: .07em; text-transform: uppercase;
    color: var(--mute); background: var(--void); padding: 2px 7px; white-space: nowrap;
  }
  .fnode {
    display: grid; justify-items: center; gap: 6px; padding: 0; border: 0; background: none;
    color: inherit; font: inherit; cursor: pointer; text-align: center;
    width: var(--fsize, 108px); max-width: 68vw;
    margin-left: calc(var(--fx, 50%) - var(--fsize, 108px) / 2);
  }
  .fnode img {
    width: 100%; aspect-ratio: 1 / 1; object-fit: cover; display: block;
    border-radius: 26%;
    box-shadow: 0 10px 26px rgba(0,0,0,.55), 0 0 0 2px var(--accent, var(--volt));
  }
  .fnode b {
    font-size: 12px; font-weight: 900; color: var(--ice); max-width: 100%;
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  }
  .fnode small { font-size: 10px; color: var(--mute); font-weight: 800; letter-spacing: .04em; }
  .react {
    position: fixed; left: 50%; bottom: 82px; transform: translate(-50%, 14px); z-index: 45;
    max-width: min(86vw, 460px); padding: 11px 16px; opacity: 0; pointer-events: none;
    background: linear-gradient(180deg, rgba(150,180,255,.16), rgba(10,15,30,.5));
    -webkit-backdrop-filter: blur(20px) saturate(1.5); backdrop-filter: blur(20px) saturate(1.5);
    border: 1px solid rgba(234,242,255,.16); border-radius: 999px;
    box-shadow: 0 14px 32px rgba(0,0,0,.45), inset 0 1px 0 rgba(255,255,255,.2);
    font-size: 12.5px; font-weight: 700; color: var(--ice); text-align: center;
    transition: opacity .3s ease, transform .34s cubic-bezier(.32,.72,0,1);
  }
  .react.on { opacity: 1; transform: translate(-50%, 0); }
  html.still .react { transition: none; }
  .diff { list-style: none; margin: 6px 0 0; padding: 0; display: grid; gap: 5px; width: 100%; }
  .diff li { display: flex; gap: 8px; align-items: baseline; font-size: 11.5px; flex-wrap: wrap; }
  .diff b { color: var(--ice); font-weight: 900; min-width: 108px; }
  .diff .was { color: var(--mute); text-decoration: line-through; }
  .diff i { color: var(--volt); font-style: normal; }
  .diff .now { color: var(--volt); font-weight: 800; }
  #e-diff { flex: 1 1 100%; }
  .grpreset { margin-top: 10px; opacity: .75; font-size: 11px; }
  .nudge {
    display: flex; gap: 10px; align-items: center; flex-wrap: wrap;
    background: var(--ink); border-left: 3px solid var(--hot);
    padding: 11px 13px; margin: 0 0 12px; font-size: 12px; color: var(--mute);
  }
  .nudge b { color: var(--ice); }
  .nudge-acts { display: flex; gap: 6px; margin-left: auto; }
  html.round .nudge { border-radius: calc(var(--r, 18px) * .7); }
  .tabbar { display: flex; align-items: center; gap: 8px; margin: 0 0 10px; }
  .tabbar h3 { margin: 0; font-size: 26px; font-weight: 900; font-style: italic;
    font-variation-settings: "wdth" 74; text-transform: uppercase; letter-spacing: .01em; color: var(--ice); }
  .tabbar .chip { margin-left: auto; }
  .tabbar .tcount { color: var(--mute); font-size: 12px; font-weight: 700; align-self: flex-end; padding-bottom: 4px; }
  @media (min-width: 620px) { .tabbar h3 { font-size: 32px; } }
  /* the little diagrams, drawn from real games */
  .demo { margin: 4px 0 10px; }
  .dcard, .dlib, .dflow {
    position: relative; background: var(--void); border: 1px solid var(--edge); overflow: hidden;
  }
  .dm {
    position: absolute; z-index: 5; width: 16px; height: 16px; border-radius: 50%;
    background: var(--volt); color: var(--void); font-size: 9.5px; font-weight: 900;
    font-style: normal; display: grid; place-items: center;
    box-shadow: 0 0 0 2px var(--void);
  }
  .dkeys { list-style: none; margin: 8px 0 0; padding: 0; display: grid; gap: 4px; }
  .dkeys li { display: flex; gap: 7px; align-items: flex-start; font-size: 10.5px; color: var(--mute); font-weight: 700; }
  .dkeys i {
    flex: none; width: 16px; height: 16px; border-radius: 50%; background: var(--volt); color: var(--void);
    font-size: 9.5px; font-weight: 900; font-style: normal; display: grid; place-items: center;
  }

  /* card anatomy */
  .dcard { height: 116px; }
  .dbg {
    position: absolute; right: 0; top: 0; bottom: 0; width: 58%;
    background-size: cover; background-position: right center; opacity: .3;
    -webkit-mask-image: linear-gradient(90deg, transparent, #000 70%);
    mask-image: linear-gradient(90deg, transparent, #000 70%);
  }
  .dcov { position: absolute; left: 12px; top: 13px; width: 54px; aspect-ratio: 3/4; object-fit: cover; }
  .dtitle {
    position: absolute; left: 76px; top: 14px; right: 76px; font-size: 11px; font-weight: 900;
    font-style: italic; font-variation-settings: "wdth" 72; text-transform: uppercase; color: var(--ice);
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  }
  .dsub { position: absolute; left: 76px; top: 31px; font-size: 9px; color: var(--mute); font-weight: 800; }

  /* rounded instead of chamfered — every clipped corner becomes a radius */

  /* days as rings, the way a tracker shows them */

  /* the numbers are the point of this tab, so they get the room */

  .bignum {

<div id="sheet"><div class="sheet-in" id="sheet-in"></div></div>

<script>
const KEY = "gq:data", KKEY = "gq:rawgkey";
const STATES = [["upcoming", "Upcoming"], ["backlog", "Out, not played"], ["playing", "Playing now"],
  ["played", "Played it"], ["dropped", "Started and dropped"]];
const isDropped = g => (g && g.state) === "dropped";
const isPlayed = g => S.played.some(p => p.id === (g && g.id));
const playedRec = g => S.played.find(p => p.id === (g && g.id));
/* keep the played record in step with the state you picked */
/* One record per game. Where a game ended up with several, take the best
   verdict, the most runs, any replay flag and the earliest date — nothing you
   entered is thrown away, it is just no longer counted twice. */
function dedupePlayed() {
  const by = new Map();
  let dupes = 0, junk = 0;
  (S.played || []).forEach(p2 => {
    if (!p2 || !p2.id) { junk++; return; }   /* a record with no game is not a record */
    const cur = by.get(p2.id);
    if (!cur) { by.set(p2.id, Object.assign({}, p2)); return; }
    dupes++;
    cur.real = Math.max(num(cur.real, 0, 0, 10), num(p2.real, 0, 0, 10));
    cur.runs = Math.max(num(cur.runs, 1, 1, 12), num(p2.runs, 1, 1, 12));
    cur.again = cur.again || p2.again;
    if (p2.t && (!cur.t || p2.t < cur.t)) cur.t = p2.t;
  });
  if (dupes || junk) S.played = [...by.values()];
  return dupes;
}

function syncPlayed(g, state) {
  const has = isPlayed(g);
  if (state === "played" && !has) S.played.push({ id: g.id, real: 0, t: new Date().toISOString().slice(0, 10) });
  if (state !== "played" && has) S.played = S.played.filter(p => p.id !== g.id);
}
/* The one thing the app never asked. Every other number is you judging a game;
   this is you saying what it was that got you. */
const WHY_GROUPS = [
  ["Story and people", [
    ["chars", "Characters"], ["arcs", "How they changed"], ["twist", "Plot twists"],
    ["story", "The story"], ["write", "The writing"], ["feels", "It got to me"],
    ["funny", "It was funny"]
  ]],
  ["World and craft", [
    ["world", "The world"], ["explore", "Finding things"], ["mood", "Atmosphere"],
    ["style", "Art style"], ["music", "Music"], ["ideas", "Its ideas"]
  ]],
  ["Playing it", [
    ["play", "How it plays"], ["hard", "The challenge"], ["think", "Out-thinking it"],
    ["master", "Getting good at it"], ["power", "Feeling powerful"],
    ["comp", "Beating other people"], ["mayhem", "Mayhem"],
    ["build", "Making things in it"], ["finish", "Clearing it out"]
  ]],
  ["Around it", [
    ["people", "Who I played it with"], ["nost", "Nostalgia"]
  ]]
];
const WHY = WHY_GROUPS.flatMap(([, list]) => list);
const whyOf = g => Array.isArray(g && g.why) ? g.why : [];

/* One bar for every conclusion the app draws about you. Raw counts — duels
   settled, hours queued, where you stand — are facts and always show. Anything
   that interprets them waits until there is enough behind it, because a number
   on screen gets believed however carefully it is captioned. */
const analysisNeed = () => num(S.analysisAt, 3, 1, 20);
function analysisReady() {
  const have = playedRows().length;
  const need = analysisNeed();
  return { ok: have >= need, have, need };
}
function gateBlock(what) {
  const a = analysisReady();
  const pct = Math.min(100, Math.round(a.have / a.need * 100));
  return `<div class="gate">
    <div class="gatebar"><i style="width:${pct}%"></i></div>
    <p class="gatetop">${a.have} of ${a.need} games scored</p>
    <p class="note">${esc(what)} stays shut until then. Rate what you finish — the app is still recording everything, it just won't draw conclusions from four data points.</p>
  </div>`;
}

/* A year, read from the date each game was scored. Anything without a date sits
   outside every year rather than being guessed into one. */
function yearsWithPlays() {
  const set = new Set();
  (S.played || []).forEach(p2 => { if (p2.real > 0 && p2.t) set.add(p2.t.slice(0, 4)); });
  return [...set].sort().reverse();
}

function yearReport(y) {
  const rows = (S.played || [])
    .filter(p2 => p2.real > 0 && p2.t && p2.t.slice(0, 4) === String(y))
    .map(p2 => ({ ...p2, g: S.games.find(x => x.id === p2.id) }))
    .filter(x => x.g);
  if (!rows.length) return null;

  const avg = rows.reduce((a, x) => a + x.real, 0) / rows.length;
  /* the length of what you finished — not time sat playing, which is not tracked */
  const hours = rows.reduce((a, x) => a + num(x.g.hours, 0, 0, 1000), 0);
  const best = rows.slice().sort((a, b) => b.real - a.real)[0];
  const withHype = rows.filter(x => x.g.hype > 0);
  const worst = withHype.slice().sort((a, b) => (a.real - a.g.hype) - (b.real - b.g.hype))[0];
  const sharp = withHype.slice().sort((a, b) =>
    Math.abs(a.real - a.g.hype) - Math.abs(b.real - b.g.hype))[0];

  const byGenre = {};
  rows.forEach(x => platList(x.g.genres).forEach(n => {
    byGenre[n] = byGenre[n] || { n: 0, hours: 0 };
    byGenre[n].n++; byGenre[n].hours += num(x.g.hours, 0, 0, 1000);
  }));
  const genres = Object.entries(byGenre)
    .map(([name, v]) => ({ name, ...v })).sort((a, b) => b.hours - a.hours || b.n - a.n);

  const labels = {};
  rows.forEach(x => {
    const r = relationship(x.g, x);
    if (r) labels[r[0]] = (labels[r[0]] || 0) + 1;
  });

  const months = Array(12).fill(0);
  rows.forEach(x => { const m = +x.t.slice(5, 7) - 1; if (m >= 0 && m < 12) months[m]++; });

  return { y: String(y), n: rows.length, avg, hours, best, worst, sharp, genres,
    labels: Object.entries(labels).sort((a, b) => b[1] - a[1]), months,
    replays: rows.filter(x => num(x.runs, 1, 1, 12) > 1).length };
}

/* One pick for the time you've actually got. Hours-to-beat is a game's whole
   length, not a sitting, so a short evening doesn't rule out a long game — it
   changes whether starting one is a sensible idea tonight. */
function tonight(hrs) {
  const live = S.games.filter(g => !isPlayed(g) && !isDropped(g) && !isUpcoming(g));
  if (!live.length) return null;
  const elo = eloTable();
  const ranks = live.map(g => elo[g.id] || 1500);
  const hi = Math.max(...ranks), lo = Math.min(...ranks);
  const span = Math.max(1, hi - lo);

  const scored = live.map(g => {
    const len = num(g.hours, 0, 0, 1000);
    const x = expected(g);
    let pts = 0;
    const why = [];
    /* where it sits in your own ranking is the strongest signal you have */
    pts += ((elo[g.id] || 1500) - lo) / span * 40;
    pts += num(g.hype, 0, 0, 10) * 2.5;
    /* already started beats anything not started */
    if ((g.state || "") === "playing") { pts += 26; why.push("you're already in it"); }
    if (len && len <= hrs) { pts += 22; why.push("short enough to finish tonight"); }
    else if (len && len <= hrs * 3) { pts += 12; why.push("about " + Math.ceil(len / hrs) + " sittings like tonight"); }
    else if (len && len > hrs * 10) {
      /* the further past a sensible run of evenings it is, the worse a call it
         is tonight — a flat penalty let a long favourite win every time */
      const over = len / (hrs * 10);
      pts -= Math.min(38, 14 + (over - 1) * 22);
      why.push("a " + len + " hour commitment — not a tonight decision");
    }
    if (!len) why.push("no length on it yet");
    if (x && x.drift >= 1) { pts += 6; why.push("you usually end up rating these higher than you expect"); }
    if (x && x.drift <= -1) { pts -= 6; why.push("your record says this one may land under your hype"); }
    return { g, pts, why, x, len };
  }).sort((a, b) => b.pts - a.pts);

  return { top: scored[0], rest: scored.slice(1, 3), n: live.length };
}

/* What your hype is actually worth, for a game you haven't played.
   Your overall drift, plus whatever this game's genres add on top of it. Returns
   null until there is enough behind it to be worth saying out loud. */
function expected(g) {
  const b = hypeBias();
  const hype = num(g && g.hype, 0, 0, 10);
  if (!hype || !b.n || !analysisReady().ok) return null;
  const gen = genrePattern();
  const mine = platList(g.genres).map(n => gen.find(x => x.name === n)).filter(Boolean);
  /* a genre with its own record overrides the general drift for that share of it */
  const gDrift = mine.length ? mine.reduce((a, x) => a + x.mean, 0) / mine.length : null;
  const drift = gDrift == null ? b.mean : (b.mean + gDrift) / 2;
  const raw = hype + drift;
  return {
    score: Math.max(1, Math.min(10, raw)),
    drift,
    n: b.n,
    genre: mine.length ? mine[0].name : null,
    genreN: mine.length ? mine[0].n : 0,
    /* the spread of your past misses is the honest error bar */
    spread: b.spread || 0
  };
}

/* Which reasons show up on the games you rated highest. A reason that appears on
   everything says nothing — what matters is the gap between the games carrying it
   and the ones that aren't. */
function whyPull() {
  const rows = playedRows().filter(x => whyOf(x.g).length);
  if (rows.length < analysisNeed()) return { n: rows.length, list: [] };
  const all = rows.reduce((a, x) => a + x.real, 0) / rows.length;
  const list = WHY.map(([k, label]) => {
    const has = rows.filter(x => whyOf(x.g).includes(k));
    if (has.length < 2) return null;
    const mean = has.reduce((a, x) => a + x.real, 0) / has.length;
    return { k, label, n: has.length, mean, lift: mean - all };
  }).filter(Boolean).sort((a, b) => b.lift - a.lift);
  return { n: rows.length, all, list };
}

const isUpcoming = g => {
  if ((g.state || "") === "upcoming") {
    if (!g.date) return true;
    return new Date(g.date) > new Date();   /* out already? then it's playable */
  }
  return false;
};

/* What a finished game turned out to be, read from hype against the verdict and
   what you did afterwards. Only ever one label, and only when it's earned. */
function relationship(g, rec) {
  const real = rec && rec.real;
  if (!(real > 0)) return null;
  const hype = num(g.hype, 0, 0, 10);
  const d = hype ? real - hype : 0;
  const runs = num(rec.runs, 1, 1, 12);
  if (isDropped(g)) return hype >= 8
    ? ["The one that got away", "Everything about it should have been yours, and you still walked away."]
    : ["Left on the shelf", "You gave it a go and it didn't hold you."];
  if (runs >= 3) return ["The obsession", "Three runs or more. This one isn't a game to you any more, it's a place you go back to."];
  if (hype && d <= -3) return ["The heartbreak", "You wanted this more than almost anything, and it didn't land. Those sting longest."];
  if (hype && d >= 3) return ["The hidden gem", "You barely expected anything from it. It repaid you " + d.toFixed(0) + " points over."];
  if (real >= 9 && rec.again) return ["The attachment", "Top marks and you still want another run. You didn't just rate this one, you kept it."];
  if (real >= 9) return ["The benchmark", "One of your highest. This is the bar everything else gets measured against now."];
  if (hype && Math.abs(d) <= 1 && real >= 7) return ["Called it", "You read this one exactly right before you ever played it."];
  if (real <= 4) return ["The write-off", "It didn't work, and you said so plainly."];
  return ["The steady one", "No drama in either direction. Fine, and finished."];
}

const RATINGS = [["story", "Story"], ["music", "Music"], ["gameplay", "Gameplay"], ["replay", "Replayability"]];
const PALETTE = [
  "#4DA3FF","#2E6BFF","#5AE0FF","#3FD9A4","#5BD75B","#C8E04A","#F0A63C","#FF7A3C",
  "#FF5470","#FF7AD9","#B45CFF","#7C5CFF","#C8A44A","#9AA7BF","#E8E2D0","#FF3355"
];
let S = { games: [], duels: [], played: [] };
let rawgKey = "";
let form = { status: "confirmed", hype: 7, img: "", colour: PALETTE[0], state: "upcoming", platforms: "", critic: 0 };
let editing = null;
let focusId = null;
let collapsed = false;
let lastHero = null;
let morphId = null;

function mix(hex, to, amt) {
  const p = c => parseInt(c, 16);
  const a = [hex.slice(1, 3), hex.slice(3, 5), hex.slice(5, 7)].map(p);
  const b = [to.slice(1, 3), to.slice(3, 5), to.slice(5, 7)].map(p);
  return "#" + a.map((v, i) => Math.round(v * (1 - amt) + b[i] * amt).toString(16).padStart(2, "0")).join("");
}
let bgSlot = 1;
function applyLook() {
  const r = document.documentElement;
  r.style.setProperty("--bgo", (S.bgOpacity == null ? 58 : S.bgOpacity) / 100);
  r.style.setProperty("--bgb", (S.bgBlur == null ? 5 : S.bgBlur) + "px");
  r.style.setProperty("--afh", num(S.artFloat, 10, 0, 40) + "px");
  r.style.setProperty("--afs", (num(S.artSpeed, 60, 15, 160) / 10) + "s");
  r.style.setProperty("--aglow", num(S.artGlow, 9, 0, 46) + "px");
  r.classList.toggle("still", S.motion === false);
  r.classList.toggle("tabfade", !!S.tabFade);
  r.classList.toggle("rowanim", !!S.rowAnim);
  r.classList.toggle("round", S.corners !== "sharp");
  r.classList.toggle("paper", S.paper !== "flat");
  const wc = HEX.test(S.paperCol || "") ? S.paperCol : "#2F6BFF";
  r.style.setProperty("--w0", mix(wc, "#01020A", 0.94));
  r.style.setProperty("--w1", mix(wc, "#01020A", 0.8));
  r.style.setProperty("--w2", mix(wc, "#01020A", 0.58));
  r.style.setProperty("--w3", mix(wc, "#FFFFFF", 0.05));
  r.style.setProperty("--wop", num(S.paperStr, 85, 0, 100) / 100);
  r.style.setProperty("--r", num(S.radius, 18, 0, 34) + "px");
  r.style.setProperty("--kshy", num(S.figShadowY, 18, 0, 70) + "px");
  r.style.setProperty("--kshb", num(S.figShadowB, 34, 0, 90) + "px");
  r.style.setProperty("--ksho", num(S.figShadowO, 72, 0, 95) / 100);
  r.style.setProperty("--kglb", num(S.figGlowB, 0, 0, 90) + "px");
  r.style.setProperty("--kglo", num(S.figGlowO, 0, 0, 100) + "%");
  r.style.setProperty("--railw", num(S.railW, 92, 64, 150) + "px");
  const navMode = S.nav || "auto";
  const wide = window.innerWidth >= 760;
  const onRail = navMode === "rail" || (navMode === "auto" && wide);
  r.classList.toggle("rail", onRail);
  /* folding only means anything while the rail exists */
  r.classList.toggle("railoff", onRail && !!S.railOff);
}

function applyBg() {
  const layers = [$("#bgart"), $("#bgart2")];
  if (!layers[0] || !layers[1]) return;
  if (!onQueueTab()) {
    if (S.bgQueueOnly) layers.forEach(l => { l.style.opacity = "0"; l.dataset.src = ""; });
    return;
  }
  if (S.bgOff) { layers.forEach(l => { l.style.opacity = "0"; l.dataset.src = ""; }); return; }
  const mode = S.bgMode || "art";
  let src = "";
  if (mode === "custom") src = S.bgImg || "";
  else if (mode === "art") {
    const focus = S.games.find(g => g.id === focusId) || sortGames(liveGames())[0];
    if (focus) src = focus.img || placeholder(focus);
  }
  if (!src) { layers.forEach(l => { l.style.opacity = "0"; l.dataset.src = ""; }); return; }
  const shown = layers[bgSlot];
  if (shown.dataset.src === src) { shown.style.opacity = "var(--bgo, .58)"; return; }
  const next = layers[1 - bgSlot];
  next.style.backgroundImage = `url("${src}")`;
  next.dataset.src = src;
  next.style.opacity = "var(--bgo, .58)";
  shown.style.opacity = "0";
  bgSlot = 1 - bgSlot;
}

const $ = s => document.querySelector(s);
let AC, userTouched = false;
["pointerdown", "touchstart", "mousedown", "click", "keydown"].forEach(t =>
  document.addEventListener(t, () => { userTouched = true; }, { capture: true, passive: true }));

/* one context, and never before the user has touched something — Chrome blocks it otherwise */
function audio() {
  if (!S.sound || !userTouched) return null;
  try {
    AC = AC || new (window.AudioContext || window.webkitAudioContext)();
    if (AC.state === "suspended" && AC.resume) AC.resume();
    return AC;
  } catch (e) { return null; }
}
function blip(ac, at, freq, vol, dur, type) {
  try {
    const o = ac.createOscillator(), g = ac.createGain();
    o.type = type || "square"; o.frequency.value = freq;
    g.gain.setValueAtTime(0, at);
    g.gain.linearRampToValueAtTime(vol, at + 0.005);
    g.gain.exponentialRampToValueAtTime(0.0001, at + dur);
    o.connect(g).connect(ac.destination);
    o.start(at); o.stop(at + dur + 0.02);
  } catch (e) {}
}
function beep(kind) {
  const ac = audio();
  if (!ac) return;
  const notes = {
    tap:    [[520, 0.045, "triangle", 0.05]],
    open:   [[420, 0.07, "triangle", 0.06], [630, 0.09, "triangle", 0.05]],
    add:    [[523, 0.08, "triangle", 0.06], [659, 0.08, "triangle", 0.06], [880, 0.16, "triangle", 0.05]],
    swipe:  [[300, 0.06, "sine", 0.04], [200, 0.07, "sine", 0.03]],
    nudge:  [[760, 0.035, "square", 0.025]],
    back:   [[300, 0.06, "triangle", 0.04]]
  }[kind] || [];
  let t = ac.currentTime;
  notes.forEach(([freq, dur, type, vol]) => {
    blip(ac, t, freq, vol, dur, type);
    t += dur * 0.72;
  });
}

/* ---- reveal choreography: the pips tick up, then the rings sweep ----
   every delay below is shared by the CSS and the audio, so they can't drift */
const pace = () => num(S.pace, 100, 40, 250) / 100;
const PD = i => Math.round((200 + i * 42) / pace());
const PDUR = () => Math.round(300 / pace());
/* the rings wait for the hype accent to land, so the two never collide */
const PTAIL = g => PD(num(g && g.hype, 0, 0, 10)) + Math.round(110 / pace());
const RD = (i, g) => PTAIL(g) + Math.round((60 + i * 95) / pace());
const RDUR = () => Math.round(720 / pace());

function revealSound(g, force) {
  if (!g || S.motion === false) return;
  if (!force && !userTouched) return;
  const mode = S.ticks == null ? "both" : S.ticks;
  if (mode === "off") return;
  const ac = audio();
  if (!ac) return;
  const base = num(S.tickPitch, 760, 380, 1500);
  const vol = num(S.tickVol, 34, 0, 100) / 100 * 0.11;
  if (!vol) return;
  const t0 = ac.currentTime + 0.03, sec = ms => ms / 1000;

  if (mode === "both" || mode === "hype") {
    const n = num(g.hype, 0, 0, 10);
    for (let i = 0; i < n; i++)
      blip(ac, t0 + sec(PD(i)), base * Math.pow(2, i / 30), vol * 0.5, 0.03, "square");
    if (n) blip(ac, t0 + sec(PD(n) + 70), base * 1.5, vol * 0.8, 0.1, "triangle");
  }
  if (mode === "both" || mode === "rings") {
    const rated = RATINGS.map(([k], i) => [i, num((g.mine || {})[k], 0, 0, 10)]).filter(x => x[1] > 0);
    rated.forEach(([i, v], n) => {
      blip(ac, t0 + sec(RD(i, g)), base * 0.62 * Math.pow(2, n / 12), vol * 0.55, 0.05, "triangle");
    });
    if (rated.length) {
      const last = RD(rated[rated.length - 1][0], g) + RDUR();
      blip(ac, t0 + sec(last), base * 0.62, vol * 0.9, 0.13, "triangle");
      blip(ac, t0 + sec(last + 55), base * 0.93, vol * 0.75, 0.16, "triangle");
    }
  }
}

let toastTimer;
/* a word back when something you did says something */
function react(kind, g, extra) {
  if (S.reactions === false) return;
  const t = g ? g.title : "";
  const lines = {
    loved: ["You really liked " + t + ".", t + " landed — " + extra + ".", "A " + extra + ". That's rare for you."],
    hated: [t + " didn't land.", "Well below what you hoped for."],
    beat: ["Better than you expected — " + t + " beat your hype by " + extra + ".", "You undersold " + t + "."],
    under: ["You were " + extra + " points hot on " + t + ".", t + " didn't live up to the hype you gave it."],
    called: ["Called it. " + t + " landed exactly where you said."],
    dropped: ["Fair enough. " + t + " goes in the dropped pile.", "Walking away is data too."],
    duels: [extra + " duels in. Your order is starting to mean something."],
    tenth: ["Ten games in the queue. Worth a backup."],
    hours: ["That's " + extra + " logged on " + t + "."]
  }[kind];
  if (!lines || !lines.length) return;
  const msg = lines[Math.floor(Math.random() * lines.length)].trim();
  const box = $("#react");
  if (!box) return;

/* Re-encodes PNG figures already in storage. Runs one at a time so a phone
   isn't holding five decoded bitmaps at once. Skips anything WebP can't beat. */
function recompressArt(onProgress) {
  const jobs = [];
  S.games.forEach(g => ["key", "art"].forEach(f => {
    const v = g[f];
    if (typeof v === "string" && v.indexOf("data:image/png") === 0) jobs.push([g, f, v]);
  }));
  let before = 0, after = 0, changed = 0, done = 0;
  const step = ([g, f, v]) => new Promise(res => {
    const im = new Image();
    const fin = () => { done++; if (onProgress) onProgress(done, jobs.length); res(); };
    im.onerror = fin;
    im.onload = () => {
      try {
        const c = document.createElement("canvas");
        c.width = im.width || 1; c.height = im.height || 1;
        c.getContext("2d").drawImage(im, 0, 0);
        if (looksBlank(c)) { fin(); return; }   /* never trade a good image for an empty one */
        const out = encodeArt(c);
        if (out.indexOf("data:image/webp") === 0 && out.length < v.length) {
          before += v.length; after += out.length; changed++; g[f] = out;
        }
      } catch (e) {}
      fin();
    };
    im.src = v;
  });
  return jobs.reduce((ch, j) => ch.then(() => step(j)), Promise.resolve())
    .then(() => ({ found: jobs.length, changed: changed, savedKb: Math.round((before - after) * 2 / 1024) }));
}

    const r = d[i], g = d[i + 1], b = d[i + 2];
    const mx = Math.max(r, g, b), mn = Math.min(r, g, b);
    if (mx < 60 || mx > 245) continue;
    const score = (mx - mn) * (mx / 255);
    if (score > bestScore) { bestScore = score; best = [r, g, b]; }
  }
  return best ? "#" + best.map(v => Math.min(255, Math.round(v * 1.12)).toString(16).padStart(2, "0")).join("") : null;
}
/* WebP at the same visual quality is roughly a third of JPEG's size, which is
   what makes a sharp cover affordable. Falls back when a browser can't encode it. */
function encodePhoto(canvas, q) {
  let w = "";
  try { w = canvas.toDataURL("image/webp", q == null ? 0.8 : q); } catch (e) { w = ""; }
  if (w && w.indexOf("data:image/webp") === 0) return w;
  return canvas.toDataURL("image/jpeg", 0.82);
}

/* how wide an uploaded cover is kept. 260 was set when everything was PNG and
   storage was tight; a cover fills a third of the screen on the Fold, so 260
   arrives visibly soft. */
const COVER_W = { soft: 320, sharp: 720, max: 1100 };
const coverW = () => COVER_W[S.coverQ] || COVER_W.sharp;

/* true if the canvas came out empty — fully transparent, or one flat colour with
   nothing in it. That is what a failed drawImage leaves behind. */
const BIG_IMG = note => "Couldn't use that image" +
  (note ? " — every route failed, last at \"" + note + "\"" : "") +
  ". Tell Claude that line and it'll know exactly where it broke.";

function looksBlank(c) {
  try {
    const ctx = c.getContext("2d");
    const w = c.width, h = c.height;
    const pts = [[w * .5, h * .5], [w * .25, h * .25], [w * .75, h * .25],
                 [w * .25, h * .75], [w * .75, h * .75], [w * .5, h * .15], [w * .5, h * .85]];
    let alpha = 0;
    pts.forEach(([x, y]) => {
      const d = ctx.getImageData(Math.min(w - 1, x | 0), Math.min(h - 1, y | 0), 1, 1).data;
      alpha += d[3];
    });
    return alpha === 0;                    /* nothing was drawn at all */
  } catch (e) { return false; }            /* can't tell — don't block the save */
}

/* Decodes a file to a canvas no wider than maxW, trying every route a browser
   might offer and reporting which one it got to. done(canvas, note) — canvas is
   null on failure and note says where it stopped, so a report means something. */
function decodeToCanvas(file, maxW, done) {
  let where = "start";
  const fail = () => done(null, where);

  /* one pass: source -> a canvas of exactly nw x nh, in strips if asked */
  const scaleTo = (src, sw, sh, nw, nh, strips) => {
    const t = document.createElement("canvas"); t.width = nw; t.height = nh;
    const tx = t.getContext("2d");
    if (!tx) return null;
    tx.imageSmoothingEnabled = true;
    try { tx.imageSmoothingQuality = "high"; } catch (e) {}
    if (strips > 1) {
      /* asking for a small piece at a time succeeds where one big filtered
         scale of a 15-megapixel source quietly does nothing */
      for (let i = 0; i < strips; i++) {
        const sy = Math.round(sh * i / strips), sy2 = Math.round(sh * (i + 1) / strips);
        const dy = Math.round(nh * i / strips), dy2 = Math.round(nh * (i + 1) / strips);
        if (sy2 <= sy || dy2 <= dy) continue;
        tx.drawImage(src, 0, sy, sw, sy2 - sy, 0, dy, nw, dy2 - dy);
      }
    } else {
      tx.drawImage(src, 0, 0, sw, sh, 0, 0, nw, nh);
    }
    return t;
  };

  const paint = (src, tag, cb) => {
    where = tag + ":draw";
    const iw = src.width || 1, ih = src.height || 1;
    if (!iw || !ih) return cb(null);
    const w = Math.max(1, Math.min(maxW, iw));
    const h = Math.max(1, Math.round(ih * w / iw));
    try {
      /* try it whole, then in strips; more strips means smaller asks */
      for (const strips of [1, 4, 12]) {
        let cur = src, cw = iw, ch = ih, dead = false;
        /* halve down first — a 5x jump in one go is itself unreliable */
        while (cw > w * 2 && !dead) {
          const nw = Math.max(w, Math.round(cw / 2)), nh = Math.max(1, Math.round(ch / 2));
          const t = scaleTo(cur, cw, ch, nw, nh, cur === src ? strips : 1);
          if (!t || looksBlank(t)) { dead = true; break; }
          cur = t; cw = nw; ch = nh;
        }
        if (dead) continue;
        const c = scaleTo(cur, cw, ch, w, h, cur === src ? strips : 1);
        if (c && !looksBlank(c)) {
          where = tag + (strips > 1 ? ":strips" + strips : "");
          return cb(c);
        }
      }
      where = tag + ":blank";
      cb(null);
    } catch (e) { where = tag + ":threw"; cb(null); }
  };

  /* each rung is tried in turn; the first that produces a real canvas wins */
  const ladder = [
    /* resize during decode — the full frame is never allocated */
    next => {
      if (!self.createImageBitmap) return next();
      let pr;
      try { pr = createImageBitmap(file, { resizeWidth: maxW, resizeQuality: "high" }); }
      catch (e) { return next(); }
      if (!pr || !pr.then) return next();
      pr.then(bm => paint(bm, "bitmap-resized", c => { try { bm.close(); } catch (e) {} c ? done(c, where) : next(); }),
              () => next());
    },
    /* some builds reject the resize options but decode fine without them */
    next => {
      if (!self.createImageBitmap) return next();
      let pr;
      try { pr = createImageBitmap(file); } catch (e) { return next(); }
      if (!pr || !pr.then) return next();
      pr.then(bm => paint(bm, "bitmap-plain", c => { try { bm.close(); } catch (e) {} c ? done(c, where) : next(); }),
              () => next());
    },
    /* an object URL avoids building a base64 copy of a 4 MB file in memory */
    next => {
      let url;
      try { url = URL.createObjectURL(file); } catch (e) { return next(); }
      const im = new Image();
      const go = () => paint(im, "objecturl", c => {
        try { URL.revokeObjectURL(url); } catch (e) {}
        c ? done(c, where) : next();
      });
      im.onerror = () => { try { URL.revokeObjectURL(url); } catch (e) {} where = "objecturl:decode"; next(); };
      im.onload = () => { if (im.decode) im.decode().then(go, go); else go(); };
      im.src = url;
    },
    /* the original route, kept last */
    next => {
      const rd = new FileReader();
      rd.onerror = () => { where = "dataurl:read"; next(); };
      rd.onload = () => {
        const im = new Image();
        const go = () => paint(im, "dataurl", c => c ? done(c, where) : next());
        im.onerror = () => { where = "dataurl:decode"; next(); };
        im.onload = () => { if (im.decode) im.decode().then(go, go); else go(); };
        im.src = rd.result;
      };
      rd.readAsDataURL(file);
    }
  ];

  let i = 0;
  const next = () => { const step = ladder[i++]; step ? step(next) : fail(); };
  next();
}

/* maxW defaults to cover size; a backdrop fills the screen and needs more */
function readFile(file, cb, maxW) {
  decodeToCanvas(file, maxW || coverW(), (c, note) => {
    if (!c) { cb(null, 0, note); return; }
    try { cb(encodePhoto(c), colourFrom(c), note, c.width); }
    catch (e) { cb(null, 0, "encode:" + note); }
  });
}

/* WebP keeps the transparency a cut-out figure needs, at roughly a ninth of
   PNG's weight. Chrome hands back a PNG without complaining when it can't
   encode WebP, so the prefix is checked rather than trusted. */
function encodeArt(canvas, q) {
  let w = "";
  try { w = canvas.toDataURL("image/webp", q == null ? 0.82 : q); } catch (e) { w = ""; }
  if (w && w.indexOf("data:image/webp") === 0) return w;
  return canvas.toDataURL("image/png");
}

/* keeps transparency — readFile() flattens to JPEG, which would kill a cut-out PNG */
function readArt(file, cb, maxW) {
  decodeToCanvas(file, maxW || 460, (c, note) => {
    if (!c) { cb(null, 0, note); return; }
    let data;
    try { data = encodeArt(c); } catch (e) { cb(null, 0, "encode:" + note); return; }
    cb(data, Math.round(data.length * 0.75 / 1024), note, c.width);
  });
}

/* ---- queue ---- */
function days(d) {
  if (!d) return "";
  const n = Math.ceil((new Date(d) - new Date()) / 86400000);
  return n > 0 ? n + (n === 1 ? " day away" : " days away") : n === 0 ? "Out today" : "Out now";
}
const line = g => [g.date ? days(g.date) : "No date yet", g.hours ? g.hours + "h to beat" : "", "hype " + (g.hype || "-") + "/10"].filter(Boolean).join("  ·  ");
const allGames = () => S.games.slice();
const liveGames = () => S.showPlayed ? allGames() : S.games.filter(g => !isPlayed(g) && !isDropped(g));

const SORTS = [
  ["date", "Soonest"], ["hype", "Most hyped"], ["duel", "Duel order"], ["overall", "My rating"],
  ["story", "Story"], ["music", "Music"], ["gameplay", "Gameplay"], ["replay", "Replayability"],
  ["longest", "Longest"], ["shortest", "Shortest"]
];
const avgScore = g => {
  const v = RATINGS.map(([k]) => (g.mine || {})[k]).filter(x => x > 0);
  return v.length ? v.reduce((a, b) => a + b, 0) / v.length : -1;
};
function sortGames(list) {
  const m = S.sort || "manual", a = [...list];
  const byNum = f => a.sort((x, y) => {
    const d = f(y) - f(x);
    return d || (x.ord || 0) - (y.ord || 0);
  });
  if (m === "hype") return byNum(g => g.hype || 0);
  if (m === "duel") { const t = eloTable(); return byNum(g => t[g.id] || 1500); }
  if (m === "overall") return byNum(avgScore);
  if (RATINGS.some(([k]) => k === m)) return byNum(g => { const v = (g.mine || {})[m]; return v > 0 ? v : -1; });
  if (m === "longest") return byNum(g => g.hours || 0);
  if (m === "shortest") return byNum(g => (g.hours ? -g.hours : -99999));
  if (m === "date") {
    const now = Date.now();
    const tier = g => !g.date ? 1 : (new Date(g.date).getTime() >= now ? 0 : 2);
    return a.sort((x, y) => {
      const tx = tier(x), ty = tier(y);
      if (tx !== ty) return tx - ty;
      if (tx === 1) return 0;
      const dx = new Date(x.date).getTime(), dy = new Date(y.date).getTime();
      return tx === 0 ? dx - dy : dy - dx;
    });
  }
  return a.sort((x, y) => (x.ord || 0) - (y.ord || 0));
}
const nextOrd = () => S.games.reduce((m, g) => Math.max(m, g.ord || 0), 0) + 1;
function seatByHype(id) {
  const g = S.games.find(x => x.id === id); if (!g) return;
  const above = S.games.filter(x => x.id !== id && (x.hype || 0) >= (g.hype || 0)).length;
  S.games.filter(x => x.id !== id).sort((a, b) => (a.ord || 0) - (b.ord || 0))
    .forEach((x, i) => { x.ord = i < above ? i + 1 : i + 2; });
  g.ord = above + 1;
}
function move(id, dir) {
  const sorted = sortGames(liveGames());
  const i = sorted.findIndex(g => g.id === id), j = i + dir;
  if (i < 0 || j < 0 || j >= sorted.length) return;
  [sorted[i], sorted[j]] = [sorted[j], sorted[i]];
  sorted.forEach((g, k) => { S.games.find(x => x.id === g.id).ord = k + 1; });
  S.sort = "manual";
  save(); renderQueue(); applyBg();
}

/* ---- RAWG score + date refresh ----
   metacritic is null until a game is out, so this exists to be run again later.
   IGN has no public API and blocks browser requests, so Metacritic via RAWG is the only source. */
/* RAWG's search returns the closest thing it has, which for an unannounced sequel
   is often the wrong game entirely. Nothing gets written unless the name really matches. */
const nkey = x => String(x == null ? "" : x).toLowerCase().replace(/[^a-z0-9]+/g, " ").trim();
function simScore(a, b) {
  a = nkey(a); b = nkey(b);
  if (!a || !b) return 0;
  if (a === b) return 1;
  const bg = x => { const o = []; for (let i = 0; i < x.length - 1; i++) o.push(x.slice(i, i + 2)); return o; };
  const A = bg(a), B = bg(b);
  if (!A.length || !B.length) return 0;
  const seen = {};
  A.forEach(x => seen[x] = (seen[x] || 0) + 1);
  let hit = 0;
  B.forEach(x => { if (seen[x] > 0) { seen[x]--; hit++; } });
  return (2 * hit) / (A.length + B.length);
}
const titleMatch = (mine, theirs) => nkey(mine) === nkey(theirs) || simScore(mine, theirs) >= 0.9;

async function rawgLookup(g) {
  if (!rawgKey) return { err: "No RAWG key saved — add one in Settings." };
  const base = "https://api.rawg.io/api/games";
  try {
    let d;
    if (g.rawgId) {
      const r = await fetch(base + "/" + encodeURIComponent(g.rawgId) + "?key=" + encodeURIComponent(rawgKey));
      if (!r.ok) throw new Error(r.status === 401 ? "Key rejected." : "RAWG said " + r.status);
      d = await r.json();
    } else {
      const r = await fetch(base + "?key=" + encodeURIComponent(rawgKey) +
        "&search=" + encodeURIComponent(g.title) + "&page_size=1");
      if (!r.ok) throw new Error(r.status === 401 ? "Key rejected." : "RAWG said " + r.status);
      d = ((await r.json()).results || [])[0];
      if (!d) return { err: "RAWG has nothing matching that title." };
    }
    const confirmed = !!g.rawgOk;
    const named = titleMatch(g.title, d.name);
    /* a game you have as upcoming should not suddenly have shipped years ago */
    const old = d.released && new Date(d.released) < new Date() && (g.state || "upcoming") === "upcoming";
    return {
      id: d.id, name: d.name || "", critic: d.metacritic || 0, genres: mapGenres(d.genres),
      bg: d.background_image || "", tags: d.tags || [],
      about: String(d.description_raw || "").trim(),
      released: d.released || "", users: d.rating || 0, count: d.ratings_count || 0,
      sure: confirmed || (named && !old),
      why: confirmed ? "" : !named ? "it came back with “" + (d.name || "?") + "”"
        : old ? "“" + (d.name || "?") + "” is already out — that looks like an older game in the series" : ""
    };
  } catch (e) { return { err: String((e && e.message) || e) }; }
}

/* ---- Steam art ----
   Steam's API blocks browser requests (no CORS), so no metadata and no trailers.
   Its art CDN is just images though, and <img> ignores CORS — so this works with no key. */
const STEAM_CDN = "https://cdn.cloudflare.steamstatic.com/steam/apps/";
/* newer titles moved to a second host; some sit behind a per-file hash we can't guess */
const STEAM_CDN2 = "https://shared.cloudflare.steamstatic.com/store_item_assets/steam/apps/";
const STEAM_HOSTS = [STEAM_CDN, STEAM_CDN2];
function steamId(input) {
  const t = String(input == null ? "" : input).trim();
  const m = /(?:store\.steampowered\.com|steamcommunity\.com)\/app\/(\d+)/.exec(t);
  if (m) return m[1];
  const n = /^(\d{2,8})$/.exec(t);
  return n ? n[1] : "";
}
const STEAM_ART = [
  ["library_600x900_2x.jpg", "Box art", "cover"],

/* Takes whatever is in a link box and returns something that actually loads.
   A Steam link resolves to the right file for that picture, trying each of
   Steam's hosts; anything else is checked as-is. Never guesses silently — it
   says which route worked. */
async function resolveLink(value, role) {
  const raw = String(value == null ? "" : value).trim();
  if (!raw) return { url: "", how: "empty" };

  const sid = steamId(raw);
  const isFile = /\.(jpg|jpeg|png|webp|gif|avif)(\?|$)/i.test(raw);
  if (sid && !isFile) {
    const file = STEAM_FOR[role] || STEAM_FOR.cover;
    for (const host of STEAM_HOSTS) {
      const u = host + sid + "/" + file;
      if (await probeImage(u)) return { url: u, how: "steam", sid: sid, file: file };
    }
    return { url: "", how: "steam-missing", sid: sid, file: file };
  }

  const u = fixImgUrl(raw);
  if (!/^https?:/i.test(u) && !/^data:/i.test(u)) return { url: "", how: "notalink" };
  if (await probeImage(u)) return { url: u, how: u === raw ? "direct" : "fixed" };
  return { url: u, how: "noload" };
}
